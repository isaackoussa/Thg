<title>Analyste Bancaire UMOA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout : en-tête collant façon registre (banque, exercice, onglets) + colonne de fiches indicateurs, 2 colonnes au-delà de 900px */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #e8ede8;
  --ink: #13201a;
  --ink-2: #45524b;
  --ink-3: #6b7770;
  --line: #d3dbd5;
  --accent: #0c5a48;
  --accent-soft: #d9ebe3;
  --on-accent: #ffffff;
  --ok: #1a7642; --ok-bg: #e0f1e6;
  --warn: #8f5500; --warn-bg: #f9edd6;
  --bad: #b3302a; --bad-bg: #fae2df;
  --na: #6b7770; --na-bg: #eaedea;
  --s1: #2a78d6; --s1-soft: #86b6ef; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171d1a; --surface-2: #1f2724; --ink: #ecf1ee; --ink-2: #b3bdb7; --ink-3: #87928c; --line: #2c3632;
    --accent: #58c2a2; --accent-soft: #19332b; --on-accent: #07211a;
    --ok: #52c784; --ok-bg: #133022; --warn: #e4a840; --warn-bg: #36280f; --bad: #f2786d; --bad-bg: #3a1a17; --na: #87928c; --na-bg: #222a27;
    --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171d1a; --surface-2: #1f2724; --ink: #ecf1ee; --ink-2: #b3bdb7; --ink-3: #87928c; --line: #2c3632;
  --accent: #58c2a2; --accent-soft: #19332b; --on-accent: #07211a;
  --ok: #52c784; --ok-bg: #133022; --warn: #e4a840; --warn-bg: #36280f; --bad: #f2786d; --bad-bg: #3a1a17; --na: #87928c; --na-bg: #222a27;
  --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tabnum { font-variant-numeric: tabular-nums; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: grid; gap: 8px; }
.top-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mark { font-family: var(--f-display); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.12em; background: var(--accent); color: var(--on-accent); padding: 5px 7px; border-radius: 4px; }
.bank-name { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
.sub { color: var(--ink-3); font-size: 0.82rem; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrls label { display: flex; flex-direction: column; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); gap: 2px; }
select, input[type="text"], input[type="number"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.ctrls select { min-width: 0; max-width: 46vw; }
#bankSel { max-width: 60vw; }
@media (max-width: 700px) { .top { position: static; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 9px; font-weight: 600; color: var(--ink-2); white-space: nowrap; cursor: pointer; font-size: 0.92rem; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 22px; }
.section-head { display: grid; gap: 4px; }
.lede { color: var(--ink-2); max-width: 70ch; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 > * { min-width: 0; }

/* Fiches */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.card-h .t { display: grid; gap: 3px; min-width: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.tag.reg { color: var(--accent); border-color: var(--accent); }
#myStyleCard summary { cursor: pointer; list-style: none; }
#myStyleCard summary::-webkit-details-marker { display: none; }
#myStyleCard summary::before { content: '▸ '; color: var(--accent); }
#myStyleCard[open] summary::before { content: '▾ '; }
.ms-preview:not(:empty) { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
.ms-preview p { margin: 0 0 8px; }
/* Console d'administration */
.tab-back { margin-left: auto; }
.tab-logout { color: #ffb4a8 !important; }
.tab-admin { color: var(--accent); font-weight: 700; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .7rem; line-height: 18px; text-align: center; }
.live-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #1fbf6a; box-shadow: 0 0 0 0 rgba(31,191,106,.6); animation: pulse 2s infinite; vertical-align: middle; }
.live-dot.sm { width: 8px; height: 8px; }
.live-dot.off, .live-dot.idle { background: var(--ink-3); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,191,106,.55); } 70% { box-shadow: 0 0 0 8px rgba(31,191,106,0); } 100% { box-shadow: 0 0 0 0 rgba(31,191,106,0); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.online { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.who { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; font-size: .88rem; min-width: 0; overflow-wrap: anywhere; }
.who-h { display: flex; gap: 6px; align-items: center; }
.accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.acc { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.acc-h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.acc-btns { margin-top: 4px; gap: 6px; }
.acc-act:empty { display: none; }
.feed { display: grid; max-height: 60vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
#adminBox { display: grid; gap: 12px; min-width: 0; }
.ev { display: grid; grid-template-columns: 84px 26px 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: .88rem; align-items: start; }
.ev:last-child { border-bottom: 0; }
.ev time { font-variant-numeric: tabular-nums; font-weight: 600; display: grid; }
.ev time small { font-weight: 400; color: var(--ink-3); font-size: .72rem; }
.ev-b { min-width: 0; overflow-wrap: anywhere; }
.ev.new { animation: flash 2.5s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
/* Entrée de l'app par e-mail */
body.gated { overflow: hidden; }
#gate { position: fixed; inset: 0; z-index: 100; overflow-y: auto; background: radial-gradient(ellipse at top, var(--accent-soft), var(--bg) 60%); display: flex; justify-content: center; padding: 28px 16px; }
.g-wrap { width: 100%; max-width: 440px; display: grid; gap: 18px; align-content: start; margin: auto 0; }
.g-brand { display: flex; gap: 12px; align-items: center; }
.g-brand b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.g-brand small { color: var(--ink-3); font-size: 0.82rem; }
.g-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: 0 18px 40px rgba(12, 40, 30, 0.12); }
.g-form { display: grid; gap: 14px; }
.g-form h1 { font-family: var(--f-display); font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; margin: 0; }
.g-form h1 span { color: var(--accent); }
.g-form label { display: grid; gap: 5px; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.g-form input[type="email"], .g-form input[type="password"] { font-size: 1rem; padding: 10px 12px; }
.g-code { font-family: var(--f-display); font-size: 1.9rem; letter-spacing: 0.45em; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; }
.g-big { padding: 11px 14px; font-size: 1rem; }
.g-back, .g-alt { justify-self: start; }
.g-list { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; color: var(--ink-2); font-size: 0.86rem; }
.g-err { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.g-info { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.g-foot { color: var(--ink-3); font-size: 0.75rem; text-align: center; margin: 0; }
.rtypes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.rtype { position: relative; display: grid; gap: 6px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.rtype input { position: absolute; opacity: 0; pointer-events: none; }
.rtype-h { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.rtype.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.rtype:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip i { font-style: normal; font-weight: 800; }
.st-ok { color: var(--ok); background: var(--ok-bg); }
.st-warn { color: var(--warn); background: var(--warn-bg); }
.st-bad { color: var(--bad); background: var(--bad-bg); }
.st-na, .st-info { color: var(--na); background: var(--na-bg); }
.results { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.res { padding: 8px 10px; display: grid; gap: 1px; border-left: 1px solid var(--line); }
.res:first-child { border-left: 0; }
.res .y { font-size: 0.72rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.04em; }
.res .v { font-family: var(--f-display); font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.res.sel { background: var(--accent-soft); }
.res .s { font-size: 0.72rem; font-weight: 600; }
.formula { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; overflow-x: auto; }
.f-line { font-family: var(--f-math); font-size: 1.04rem; line-height: 1.9; display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.3em; }
.f-line .lbl { font-family: var(--f-body); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; width: 100%; line-height: 1.3; }
.f-res { font-weight: 600; color: var(--accent); }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.15em; max-width: 100%; }
.frac > .n { border-bottom: 1px solid currentColor; padding: 0 0.35em 0.05em; line-height: 1.5; }
.frac > .d { padding: 0.05em 0.35em 0; line-height: 1.5; }
.q { font-style: italic; }
.v-num { font-variant-numeric: tabular-nums; }
.miss { font-size: 0.85rem; color: var(--warn); }
.note { font-size: 0.82rem; color: var(--ink-3); }
.interp { color: var(--ink); max-width: 75ch; }
.interp b { font-weight: 600; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 0.86rem; font-weight: 600; }
details > div { margin-top: 6px; color: var(--ink-2); font-size: 0.9rem; display: grid; gap: 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); }

/* Synthèse */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
.tile .v { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .d { font-size: 0.8rem; color: var(--ink-3); }
.lists { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .lists { grid-template-columns: 1fr 1fr; } }
.lists ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 210px; }
thead th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
tr.tot td { font-weight: 700; background: var(--surface-2); }
tr.sub td:first-child { padding-left: 24px; color: var(--ink-2); }
tr.sec td { font-family: var(--f-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--surface); padding-top: 12px; }
td.up { color: var(--ok); }
td.down { color: var(--bad); }
td.muted { color: var(--ink-3); }
.code { font-size: 0.7rem; color: var(--ink-3); font-weight: 600; margin-right: 6px; }

/* Saisie */
.form-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.form-sec > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.inp-tbl { overflow-x: auto; }
.inp-tbl table td { padding: 3px 6px; }
.inp-tbl input { width: 100%; min-width: 92px; text-align: right; padding: 5px 6px; font-variant-numeric: tabular-nums; }
.inp-tbl input.bad { border-color: var(--bad); }
.inp-tbl td.calc { font-weight: 700; padding-right: 12px; }
.checks { display: grid; gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { color: var(--on-accent); filter: brightness(1.08); }
.btn.sm { padding: 3px 9px; font-size: 0.82rem; }
.btn.danger { color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.meta-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.meta-grid input, .meta-grid select { width: 100%; min-width: 0; }
.check input { flex: none; margin-top: 3px; }
.meta-grid label { display: grid; gap: 3px; font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
.yr-pill { display: inline-flex; gap: 4px; align-items: center; }
.yr-pill input { width: 84px; }
.confirm { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
textarea { width: 100%; min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.banner.warn { background: var(--warn-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.params { display: grid; gap: 8px; }
.param { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.param .pl { display: grid; }
.param .pl span { font-size: 0.8rem; color: var(--ink-3); }
.param input { text-align: right; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.slider { display: grid; gap: 4px; }
.slider input { width: 100%; accent-color: var(--accent); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 60; }
.method-list { display: grid; gap: 10px; }
.hist-list { display: grid; gap: 10px; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.hist > * { min-width: 0; }
.hist-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.hist-top .t { display: grid; gap: 2px; min-width: 0; }
.hist .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hist .kv { font-size: 0.8rem; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.hist .kv b { color: var(--ink); }
td.diff-up { color: var(--ok); } td.diff-down { color: var(--bad); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px 14px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.file-status { display: grid; gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; }
.file-status progress { width: 100%; accent-color: var(--accent); }
.file-status.err { background: var(--bad-bg); color: var(--bad); }
.rcode { margin: 0; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.5; white-space: pre; max-height: 70vh; }
.method-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; overflow-x: auto; }

  Object.keys(b.v).forEach(k => b.v[k].splice(pos, 0, null));
  return true;
}
function removeYear(b, i) { b.years.splice(i, 1); Object.keys(b.v).forEach(k => b.v[k].splice(i, 1)); if (b.range && !b.years.includes(b.range[0]) || b.range && !b.years.includes(b.range[1])) delete b.range; }

/* =====================================================================
   5. NOMBRES
   ===================================================================== */
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[\s  ']/g, '').replace(/[−–]/g, '-').replace(/%$/, '');
  if (s === '' || s === '-') return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const v = Number(s);
  return Number.isFinite(v) ? (neg ? -v : v) : null;
}
const fin = v => typeof v === 'number' && Number.isFinite(v);
const nfI = new Intl.NumberFormat('fr-FR', { maximumFractionDigits:0 });
const nf = d => new Intl.NumberFormat('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d });
const fmtM = v => fin(v) ? nfI.format(Math.round(v)).replace(/^-/, '−') : '—';
const fmtP = (v, d = 2) => fin(v) ? nf(d).format(v * 100).replace(/^-/, '−') + ' %' : '—';
const fmtX = v => fin(v) ? nf(2).format(v).replace(/^-/, '−') + ' ×' : '—';
const fmtPts = (d) => fin(d) ? (d >= 0 ? '+' : '−') + nf(2).format(Math.abs(d * 100)) + ' pt' : '—';
const fmtSigned = v => fin(v) ? (v >= 0 ? '+' : '−') + nfI.format(Math.abs(Math.round(v))) : '—';
const fmtBy = (f, v) => f === 'm' ? fmtM(v) : f === 'x' ? fmtX(v) : fmtP(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* =====================================================================
   6. MOTEUR DE FORMULES — une formule = un arbre, utilisé pour calculer ET afficher
   ===================================================================== */
const V = (k, off = 0) => ({ t:'v', k, off });
const Q = (id, off = 0) => ({ t:'q', id, off });
const C = (v, lbl) => ({ t:'c', v, lbl });
const P = k => ({ t:'p', k });
const MUL = (a, b) => ({ t:'*', a:[a, b] });
const DIV = (n, d) => ({ t:'/', a:[n, d] });
const M3 = x => ({ t:'m3', x });
function S(...items) {
  return { t:'s', a: items.map(it => {
    if (Array.isArray(it)) return it;
    const sg = it[0] === '-' ? -1 : 1, r = it.slice(1);
    return [sg, r.startsWith('q:') ? Q(r.slice(2)) : V(r)];
  }) };
}
function shift(n, d) {
  if (n.t === 'v' || n.t === 'q') return Object.assign({}, n, { off: n.off + d });
  if (n.t === 's') return { t:'s', a: n.a.map(([s, x]) => [s, shift(x, d)]) };
  if (n.a) return Object.assign({}, n, { a: n.a.map(x => shift(x, d)) });
  if (n.x) return Object.assign({}, n, { x: shift(n.x, d) });
  return n;
}
const AVG = x => DIV(S([1, x], [1, shift(x, -1)]), C(2));
const base = q => state.base === 'moy' ? AVG(Q(q)) : Q(q);

const ZERO_OK = new Set();
function raw(k, y) {
  const a = bank().v[k];
  if (!a) return null;
  const x = a[y + OFF()];
  return fin(x) ? x : null;
}
function newCtx() { return { miss:new Set(), notes:new Set(), decl:new Set(), est:new Set() }; }
function mergeCtx(a, b) { b.miss.forEach(x => a.miss.add(x)); b.notes.forEach(x => a.notes.add(x)); b.decl.forEach(x => a.decl.add(x)); b.est.forEach(x => a.est.add(x)); }

function ev(n, y, ctx) {
  switch (n.t) {
    case 'v': {
      const yy = y + n.off;
      if (yy + OFF() < 0) { ctx.notes.add('Exercice précédent indisponible pour ' + yearAt(y)); return NaN; }
      const x = raw(n.k, yy);
      if (x === null) { ctx.miss.add(n.k); return NaN; }
      return x;
    }
    case 'c': return n.v;
    case 'p': return (state.params[n.k] ?? DEFAULT_PARAMS[n.k]) / 100;
    case 'q': return evQ(n.id, y + n.off, ctx);
    case 's': return n.a.reduce((acc, [sg, x]) => acc + sg * ev(x, y, ctx), 0);
    case '*': return ev(n.a[0], y, ctx) * ev(n.a[1], y, ctx);
    case '/': { const a = ev(n.a[0], y, ctx), b = ev(n.a[1], y, ctx); return b === 0 ? NaN : a / b; }
    case 'm3': {
      const vals = [];
      for (let k = 0; k < 3; k++) { if (y - k + OFF() < 0) break; const c2 = newCtx(); const v = ev(shift(n.x, -k), y, c2); if (fin(v) && v > 0) vals.push(v); else if (k === 0) mergeCtx(ctx, c2); }
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
    }
  }
  return NaN;
}
function evQ(id, y, ctx) {
  const q = QTY[id];
  if (y + OFF() < 0) { ctx.notes.add('Exercice précédent indisponible'); return NaN; }
  if (q.decl && raw(q.decl, y) !== null) { ctx.decl.add(id); return raw(q.decl, y); }
  if (q.decl) ctx.est.add(id);
  const c1 = newCtx();
  const v = ev(q.node, y, c1);
  if (fin(v) || !q.alt) { mergeCtx(ctx, c1); return v; }
  const c2 = newCtx();
  const v2 = ev(q.alt, y, c2);
  if (fin(v2)) { mergeCtx(ctx, c2); ctx.notes.add(q.altNote); return v2; }
  mergeCtx(ctx, c1); mergeCtx(ctx, c2);
  return NaN;
}
const calc = (node, y) => { const c = newCtx(); const v = ev(node, y, c); return { v, c }; };
const val = (node, y) => calc(node, y).v;
const qv = (id, y) => val(Q(id), y);

/* Rendu : mode 'sym' (libellés) ou 'num' (valeurs de l'exercice y) */
function wrapIf(n, html) { return (n.t === 's' && n.a.length > 1) ? '(' + html + ')' : html; }
function R(n, mode, y) {
  switch (n.t) {
    case 'v': {
      const lab = (SHORT[n.k] || F[n.k].l) + (n.off ? ' <sub>N' + n.off + '</sub>' : '');
      if (mode === 'sym') return '<span title="' + esc(F[n.k].l) + '">' + lab + '</span>';
      const x = (y + n.off + OFF() >= 0) ? raw(n.k, y + n.off) : null;
      return x === null ? '<span class="miss">?</span>' : '<span class="v-num" data-tip="' + esc(F[n.k].l + ' ' + (yearAt(y + n.off) || '')) + '">' + (x < 0 ? '(' + fmtM(x) + ')' : fmtM(x)) + '</span>';
    }
    case 'c': return n.lbl || nf(n.v % 1 ? 1 : 0).format(n.v);
    case 'p': {
      const p = PARAMS.find(p => p.k === n.k);
      return '<span data-tip="' + esc(p ? p.l : n.k) + ' (modifiable dans Paramètres)">' + nf((state.params[n.k] % 1) ? 1 : 0).format(state.params[n.k]) + ' %</span>';
    }
    case 'q': {
      const q = QTY[n.id];
      const lab = '<span class="q">' + q.n + '</span>' + (n.off ? ' <sub>N' + n.off + '</sub>' : '');
      if (mode === 'sym') return '<span data-tip="' + esc(q.long || q.n) + '">' + lab + '</span>';
      const v = (y + n.off + OFF() >= 0) ? qv(n.id, y + n.off) : NaN;
      return '<span class="v-num" data-tip="' + esc((q.long || q.n) + ' ' + (yearAt(y + n.off) || '')) + '">' + (fin(v) ? (v < 0 ? '(' + fmtM(v) + ')' : fmtM(v)) : '<span class="miss">?</span>') + '</span>';
    }
    case 's': return n.a.map(([sg, x], i) => (i === 0 ? (sg < 0 ? '− ' : '') : (sg < 0 ? ' − ' : ' + ')) + wrapIf(x, R(x, mode, y))).join('');
    case '*': return n.a.map(x => wrapIf(x, R(x, mode, y))).join(' × ');
    case '/': return '<span class="frac"><span class="n">' + R(n.a[0], mode, y) + '</span><span class="d">' + R(n.a[1], mode, y) + '</span></span>';
    case 'm3': {
      if (mode === 'sym') return 'moyenne<sub>3 ans</sub>(' + R(n.x, mode, y) + ' &gt; 0)';
      const parts = [];
      for (let k = 2; k >= 0; k--) if (y - k + OFF() >= 0) { const v = val(shift(n.x, -k), y); parts.push(fin(v) ? fmtM(v) : '?'); }
      return 'moy(' + parts.join(' ; ') + ')';
    }
  }
  return '';
}

const ST_LABEL = { ok:['✓','Conforme'], warn:['!','Marge faible'], bad:['✕','Non conforme'], na:['–','Non calculé'], info:['·','Information'] };

function status(ind, v) {

}
function stLabel(ind, st) {

}
const chip = (ind, st) => '<span class="chip st-' + st + '"><i aria-hidden="true">' + ST_LABEL[st][0] + '</i>' + stLabel(ind, st) + '</span>';

function series(ind) { return Y().map((_, y) => val(nodeOf(ind), y)); }
function interpret(ind, vals) {
  const yrs = Y(), f = ind.fmt || 'pct', out = [];

  if (!idx.length) return '';
  const first = idx[0], last = idx[idx.length - 1];
  const fmtD = (a, b) => f === 'pct' ? fmtPts(b - a) : f === 'x' ? (b - a >= 0 ? '+' : '−') + nf(2).format(Math.abs(b - a)) : fmtSigned(b - a) + ' M';
  if (first !== last) {
    let s = 'Passe de <b>' + fmtBy(f, vals[first]) + '</b> en ' + yrs[first] + ' à <b>' + fmtBy(f, vals[last]) + '</b> en ' + yrs[last] + ' (' + fmtD(vals[first], vals[last]) + ')';
    if (idx.length >= 3) {
      const w = d => d > 0 ? 'hausse' : d < 0 ? 'baisse' : 'stabilité';
      const steps = idx.slice(1).map((i, j) => [w(vals[i] - vals[idx[j]]), yrs[i]]);
      s += steps.every(x => x[0] === steps[0][0]) ? ', ' + steps[0][0] + ' continue sur la période' : ', avec ' + steps.map(([d, yr]) => 'une ' + d + ' en ' + yr).join(', ').replace(/, (?=[^,]*$)/, ' puis ');
    }
    out.push(s + '.');
    const rel = Math.abs(vals[last] - vals[first]) / (Math.abs(vals[first]) || 1);
    if (rel > 0.02 && ind.up && ind.down) out.push(vals[last] > vals[first] ? ind.up : ind.down);
  } else out.push('Valeur ' + yrs[last] + ' : <b>' + fmtBy(f, vals[last]) + '</b>.');
  if (ind.thr) {
    const s = thrVal(ind), v = vals[last], st = status(ind, v);
    const sl = ind.thr.reg ? 'le minimum réglementaire' : 'le repère', sv = fmtP(s, 1);
    if (ind.thr.dir === 'min') {
      if (st === 'bad') out.push('En ' + yrs[last] + ', le ratio est <b>sous ' + sl + ' de ' + sv + '</b> (écart ' + fmtPts(v - s) + ').');
      else if (st === 'warn') out.push('Au-dessus de ' + sl + ' de ' + sv + ' mais avec une marge faible (' + fmtPts(v - s) + ').');
      else out.push('Confortablement au-dessus de ' + sl + ' de ' + sv + ' (marge ' + fmtPts(v - s) + ').');
    } else {
      if (st === 'bad') out.push('En ' + yrs[last] + ', le ratio <b>dépasse ' + (ind.thr.reg ? 'le plafond réglementaire' : 'le repère') + ' de ' + sv + '</b>.');
      else if (st === 'warn') out.push('Sous le plafond de ' + sv + ' mais proche de celui-ci.');

function barChart(ind, vals) {
  const W = 320, H = 132, pl = 8, pr = 8, pt = 14, pb = 22;
  const f = ind.fmt || 'pct', thr = thrVal(ind);
  const fv = vals.filter(fin);
  if (!fv.length) return '';
  let lo = Math.min(0, ...fv), hi = Math.max(0, ...fv, thr ?? 0);
  if (hi === lo) hi = lo + 1;
  hi += (hi - lo) * 0.12;
  const sy = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const n = vals.length, bw = Math.min(54, (W - pl - pr) / n * 0.62), gap = (W - pl - pr - n * bw) / (n + 1);
  let g = '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + sy(0) + '" y2="' + sy(0) + '" style="stroke:var(--line)" stroke-width="1"/>';
  vals.forEach((v, i) => {
    const x = pl + gap + i * (bw + gap);
    if (fin(v)) {
      const y0 = sy(0), y1 = sy(v), top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y0 - y1));
      const r = Math.min(4, h / 2);
      const up = v >= 0;
      const d = up
        ? 'M' + x + ',' + (top + h) + ' V' + (top + r) + ' Q' + x + ',' + top + ' ' + (x + r) + ',' + top + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + ' V' + (top + h) + ' Z'
        : 'M' + x + ',' + top + ' V' + (top + h - r) + ' Q' + x + ',' + (top + h) + ' ' + (x + r) + ',' + (top + h) + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + (top + h) + ' ' + (x + bw) + ',' + (top + h - r) + ' V' + top + ' Z';
      g += '<path d="' + d + '" style="fill:var(' + (i === state.yi ? '--s1' : '--s1-soft') + ')" data-tip="' + Y()[i] + ' : ' + esc(fmtBy(f, v)) + '"/>';
      g += '<rect x="' + (x - gap / 2) + '" y="' + pt + '" width="' + (bw + gap) + '" height="' + (H - pt - pb) + '" style="fill:transparent" data-tip="' + Y()[i] + ' : ' + esc(fmtBy(f, v)) + '"/>';
    }
    g += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="' + (n > 6 ? 9 : 11) + '" style="fill:var(--ink-3)">' + Y()[i] + '</text>';
  });
  if (thr != null && f === 'pct') {
    const ty = sy(thr);
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ty + '" y2="' + ty + '" style="stroke:var(--ink-2)" stroke-width="1.25" stroke-dasharray="4 3"/>';
    g += '<text x="' + (W - pr) + '" y="' + (ty - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--ink-2)">' + (ind.thr.reg ? 'seuil ' : 'repère ') + esc(fmtP(thr, 1)) + '</text>';
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ind.n) + ' par exercice">' + g + '</svg>';
}
const STRUCT = {
  actif: [ ['Trésorerie & interbancaire', ['A1','A3']], ['Titres', ['A2','A5','A6']], ['Crédits clientèle', ['A4']], ['Immobilisations & participations', ['A10','A11','A12','A13','A14']], ['Autres', ['A7','A8','A9']] ],

function stackChart(kind) {
  const groups = STRUCT[kind], W = 340, rowH = 26, gapR = 12, pl = 40, H = Y().length * (rowH + gapR) + 4;
  let g = '';

    body.push(W.table([['Scénario', 'Choc (M)', 'Résultat net', 'Fonds propres', 'Solvabilité', 'Appréciation'], ...st.map(s => [s.l, s.choc ? fmtM(-s.choc) : '—', fmtM(s.rn), fmtM(s.fp), fmtP(s.solva, 1), stCell(I.solva, s.solva)])], { firstCol:30, boldRows:[1] }));
    await addChart(printHBars({ title:'Solvabilité après choc', subtitle:'Ratio de solvabilité global estimé, ' + yrs[n], labels:st.map(s => s.l), values:st.map(s => s.solva), fmt:'pct', thr:{ value:thrVal(I.solva), label:'minimum ' + fmtP(thrVal(I.solva), 1) }, bad:st.map(s => s.st === 'bad') }), 'Solvabilité après choc');

  } else if (type === 'corrige') {
    cover(bankSub);
    section('Énoncé', false);
    body.push(W.p(W.run('À partir des bilans et comptes de résultat de ' + b.name + ' (' + (yrs.length > 1 ? 'exercices ' + yrs[0] + ' à ' + yrs[n] : 'exercice ' + yrs[0]) + ', montants en ' + b.unit + '), on demande :')));
    const QS = [
      ['Analysez la dynamique du bilan (actif et passif).', async () => { await dynTables(['actif', 'passif']); }, 'Le total du bilan mesure la taille de la banque ; on regarde quels postes portent sa croissance (crédits, titres, dépôts) et si les fonds propres suivent.'],
      ['Analysez la dynamique du compte de résultat.', async () => { await dynTables(['cr']); }, 'On descend la cascade : marge d’intérêts, PNB, RBE, résultat d’exploitation, résultat net. Un PNB qui progresse moins vite que les charges dégrade le RBE.'],
      ['Calculez et commentez le ratio de transformation.', async () => { await indicator(I.transfo, 3, true); }, I.transfo.about],
      ['Calculez et commentez le ratio de liquidité.', async () => { await indicator(I.liq, 3, true); }, I.liq.about],
      ['Calculez et commentez le ratio de levier.', async () => { await indicator(I.levier, 3, true); await indicator(I.mult, 3, true); }, 'Levier et multiplicateur sont inverses l’un de l’autre : plus la banque est endettée, plus le multiplicateur est grand.'],
      ['Calculez et commentez le ratio de solvabilité.', async () => { await indicator(I.solva_s, 3, true); await indicator(I.solva, 3, true); }, 'La version bilan ne pondère pas les risques ; la version Bâle rapporte les fonds propres effectifs aux actifs pondérés (minimum ' + fmtP(thrVal(I.solva), 1) + ').'],
      ['Calculez le ROA et le ROE de chaque année et expliquez l’évolution du ROE.', async () => { await indicator(I.roa, 3, true); await indicator(I.roe, 3, true); dupontBlock(3); }, 'ROE = ROA × multiplicateur : le ROE varie soit parce que les actifs rapportent plus ou moins, soit parce que la banque est plus ou moins endettée.'],
      ['Quel niveau de pertes provoquerait la faillite de la banque ?', async () => { await indicator(I.perte, 3, true); await indicator(I.abs_a, 3, true); await indicator(I.abs_c, 3, true); }, 'La faillite comptable survient quand les pertes effacent les capitaux propres : RN* = −Capitaux propres.'],
      ['Quel niveau de PNB provoquerait ces pertes ?', async () => { await failliteBlock(false); await indicator(I.pnbc, 3, true); await indicator(I.chute, 3, true); }, 'On remonte la cascade du compte de résultat à partir de RN* (impôt nul en cas de perte) pour trouver le PNB critique PNB*.']
    ];
    QS.forEach(([q], i) => body.push(W.p(W.run((i + 1) + '. ' + q), { ind:360, after:40 })));

      body.push(W.box('À retenir', keep));

    section('Conclusion générale');

  } else if (type === 'comparaison') {
    const ids = (opt.banks || []).filter(id => state.banks[id]);

        await addChart(printIndicator(I.solva, series(I.solva)), b.name + ' : ratio de solvabilité global');
        await addChart(chartRenta(), b.name + ' : ROE et ROA');
        if (detail) {
          body.push(W.h(2, 'Dynamique des comptes'));

          body.push(W.h(2, 'Ratios détaillés'));

        }

        body.push(W.h(2, 'Points de vigilance'));
        body.push(watch.length ? W.bullets(watch) : W.note('Aucun signal d’alerte avec les données saisies.'));
        body.push(W.h(2, 'Recommandations'));
        body.push(W.bullets(recommendations(n)));
      }
    } finally { state.cur = prevCur; state.yi = prevYi; }
    section('Méthodologie et glossaire');
    body.push(W.p(W.run('Chaque banque est analysée sur la période choisie pour elle dans l’app, selon le plan comptable bancaire révisé de l’UMOA et le dispositif prudentiel de la BCEAO. Les ratios Bâle III sont estimés à partir du bilan lorsque les états réglementaires ne sont pas saisis. La note globale est indicative : ce n’est pas une notation officielle.')));

    body.push(W.h(2, 'Glossaire'));
    body.push(W.table([['Terme', 'Définition'], ...GLOSSARY.map(([t, d]) => [{ t, b:true }, { t:d, align:'left' }])], { firstCol:22 }));

  async function comparisonSections(ids, withCover) {
    const rows = ids.map(id => withFull(() => {
      const bb = bank(), k = bb.years.length - 1, o = { name:bb.name, year:bb.years[k], unit:bb.unit, v:{}, sc:scoreCard(k) };
      ['TA', 'PNB', 'RN', 'CP'].forEach(q => { o.v[q] = qv(q, k); });
      COMPARE_IDS.forEach(x => { o.v[x] = val(nodeOf(I[x]), k); });
      return o;
    }, state.banks[id]));
    if (withCover) cover(rows.length + ' banques comparées sur leur dernier exercice disponible');
    section('Classement général', !withCover);
    const units = [...new Set(rows.map(r => r.unit))];
    if (units.length > 1) body.push(W.note('Attention : les banques ne sont pas saisies dans la même unité (' + units.join(', ') + ') ; les montants ne sont pas directement comparables, les ratios le sont.'));
    const ranked = rows.slice().sort((a, c) => (fin(c.sc.score) ? c.sc.score : -1) - (fin(a.sc.score) ? a.sc.score : -1));
    body.push(W.table([['Rang', 'Banque', 'Exercice', 'Note', 'Score', 'Appréciation'], ...ranked.map((r, i) => [String(i + 1), { t:r.name, align:'left', b:i === 0 }, String(r.year), { t:r.sc.grade, b:true, color:gradeColor(r.sc.grade), align:'center' }, fin(r.sc.score) ? r.sc.score + '/100' : '—', { t:r.sc.label, align:'left' }])], { firstCol:8 }));
    body.push(W.note('Note indicative sur 100 calculée sur les mêmes ratios pour chaque banque (solvabilité, CET1, levier, liquidité, transformation, ROE, ROA, coefficient d’exploitation, coût du risque).'));
    await addChart(printHBars({ title:'Note globale', subtitle:'Score indicatif sur 100', labels:ranked.map(r => r.name), values:ranked.map(r => fin(r.sc.score) ? r.sc.score : NaN), fmt:'score', bad:ranked.map(r => r.sc.score < 55) }), 'Note globale par banque');
    section('Chiffres clés');
    body.push(W.table([['Banque', 'Exercice', 'Total bilan', 'PNB', 'Résultat net', 'Capitaux propres'], ...rows.map(r => [r.name, String(r.year), fmtM(r.v.TA), fmtM(r.v.PNB), fmtM(r.v.RN), fmtM(r.v.CP)])], { firstCol:30 }));
    await addChart(printHBars({ title:'Total du bilan', subtitle:'Millions FCFA, dernier exercice', labels:rows.map(r => r.name), values:rows.map(r => r.v.TA), fmt:'m' }), 'Taille des banques (total du bilan)');
    section('Ratios');
    body.push(W.table([['Ratio', 'Seuil', ...rows.map(r => r.name)], ...COMPARE_IDS.map(id => [I[id].n, thrTxt(I[id]), ...rows.map(r => valSt(I[id], r.v[id]))])], { firstCol:28 }));
    for (const id of ['solva', 'liq', 'transfo', 'roe', 'coef']) {
      const ind = I[id], t = thrVal(ind);
      await addChart(printHBars({ title:ind.n, subtitle:'Dernier exercice disponible de chaque banque', labels:rows.map(r => r.name), values:rows.map(r => r.v[id]), fmt:'pct', thr:ind.thr ? { value:t, label:(ind.thr.dir === 'min' ? 'minimum ' : 'plafond ') + fmtP(t, 1) } : null, bad:rows.map(r => status(ind, r.v[id]) === 'bad') }), ind.n + ' par banque');
    }
    section('Lecture ratio par ratio');
    const lines = [];
    COMPARE_IDS.forEach(id => {
      const ind = I[id], ok = rows.filter(r => fin(r.v[id])); if (ok.length < 2) return;
      const lowBetter = ind.thr && ind.thr.dir === 'max';
      const s = ok.slice().sort((a, c) => lowBetter ? a.v[id] - c.v[id] : c.v[id] - a.v[id]);
      const off = ok.filter(r => status(ind, r.v[id]) === 'bad').map(r => r.name);
      lines.push('<b>' + ind.n + '</b> : meilleur niveau pour ' + s[0].name + ' (' + fmtCell(ind, s[0].v[id]) + '), le plus faible pour ' + s[s.length - 1].name + ' (' + fmtCell(ind, s[s.length - 1].v[id]) + ')' + (off.length ? ' ; hors seuil : ' + off.join(', ') : '') + '.');
    });
    body.push(lines.length ? W.bullets(lines) : W.note('Pas assez de données pour comparer les ratios.'));
    section(withCover ? 'Conclusion' : 'Conclusion de la comparaison');
    const top = ranked[0], last = ranked[ranked.length - 1];
    body.push(W.fromHtml(fin(top.sc.score) ? '<b>' + top.name + '</b> présente le profil le plus solide (note ' + top.sc.grade + ', ' + top.sc.score + '/100)' + (last !== top && fin(last.sc.score) ? ', <b>' + last.name + '</b> le plus fragile (note ' + last.sc.grade + ', ' + last.sc.score + '/100).' : '.') + ' Le classement repose sur les états financiers saisis et sur des ratios Bâle estimés à partir du bilan lorsque les données réglementaires manquent.' : 'Les données saisies ne suffisent pas pour classer les banques.'));
  }

    body.push(W.table([['Décomposition', ...yrs.map(String)], ['ROA', ...roa.map(v => fmtP(v))], ['× Multiplicateur', ...m.map(fmtX)], ['= ROE', ...roe.map(v => fmtP(v))]], { boldRows:[3], firstCol:30 }));

    body.push(M.para(M.r('RN*') + M.r(' = ') + M.r('−') + M.r('Capitaux propres')));
    M.lines('PNB* = ', QTY.PNBC.node, 'sym').forEach(l => body.push(l));
    await addChart(printBars({ title:'Test de faillite : PNB réel et PNB critique', subtitle:'Millions FCFA · la banque fait faillite si le PNB tombe au niveau critique', years:yrs, series:[{ name:'PNB réel', values:yrs.map((_, i) => qv('PNB', i)) }, { name:'PNB critique (PNB*)', values:yrs.map((_, i) => qv('PNBC', i)) }], fmt:'m' }), 'PNB réel et PNB critique');
    body.push(W.table([['Étape', ...yrs.map(String)],

      state.cur = e.bankId; state.yi = 99; save(); track('restauration', e.label); toast('Données restaurées'); state.tab = 'synthese'; renderAll(); window.scrollTo(0, 0);
    };
  });
  view.querySelectorAll('[data-hdel]').forEach(b => b.onclick = () => {
    const e = find(b.dataset.hdel), x = box(e.id); x.dataset.open = '';

    x.querySelector('[data-hdelno]').onclick = () => { x.innerHTML = ''; };
    x.querySelector('[data-hdelok]').onclick = () => { state.history = state.history.filter(z => z.id !== e.id); state.histDeleted.push(e.id); save(); scheduleSync(); toast('Analyse supprimée'); renderAll(true); };
  });
  if ($('#hClear')) $('#hClear').onclick = () => {

   12 bis. TRADUCTION EN R — générée depuis les mêmes arbres de formules

const rName = k => F[k].s === 'prud' ? k + '_decl' : k;
const rLag = (x, k) => { for (let i = 0; i < k; i++) x = 'lag1(' + x + ')'; return x; };
const rNum = v => String(Math.round(v * 1e6) / 1e6);
function toR(n) {
  const simple = x => /^[\w.$]+$/.test(x) || /^lag1\(.*\)$/.test(x) || /^moy_pos3\(.*\)$/.test(x);
  switch (n.t) {
    case 'v': return rLag(rName(n.k), -n.off);
    case 'q': return rLag(n.id, -n.off);
    case 'c': return rNum(n.v);
    case 'p': return 'p$' + n.k;
    case 's': { const t = n.a.map(([sg, x], i) => (i === 0 ? (sg < 0 ? '-' : '') : (sg < 0 ? ' - ' : ' + ')) + toR(x)).join(''); return n.a.length > 1 ? '(' + t + ')' : t; }
    case '*': return n.a.map(toR).join(' * ');
    case '/': { const a = toR(n.a[0]), b = toR(n.a[1]); return (simple(a) || a[0] === '(' && a.endsWith(')') ? a : '(' + a + ')') + ' / ' + (simple(b) || b[0] === '(' && b.endsWith(')') ? b : '(' + b + ')'); }
    case 'm3': return 'moy_pos3(' + toR(n.x) + ')';
  }
  return 'NA';
}
const stripOuter = x => (x[0] === '(' && x.endsWith(')') && balanced(x.slice(1, -1))) ? x.slice(1, -1) : x;
function balanced(x) { let d = 0; for (const c of x) { if (c === '(') d++; if (c === ')') { d--; if (d < 0) return false; } } return d === 0; }
function rQtyExpr(id) {
  const q = QTY[id];
  let e = stripOuter(toR(q.node));
  if (q.alt) e = 'si_absent(' + e + ', ' + stripOuter(toR(q.alt)) + ')';
  if (q.decl) e = 'si_absent(' + rName(q.decl) + ', ' + e + ')';
  return e;
}
function qtyOrder() {
  const seen = new Set(), out = [];
  const visit = id => { if (seen.has(id)) return; seen.add(id); const q = QTY[id]; [q.node, q.alt].filter(Boolean).forEach(n => directQ(n).forEach(visit)); out.push(id); };
  Object.keys(QTY).forEach(visit);
  return out;
}
function directQ(n, acc = new Set()) {
  if (n.t === 'q') acc.add(n.id);
  if (n.a) n.a.forEach(x => directQ(Array.isArray(x) ? x[1] : x, acc));
  if (n.x) directQ(n.x, acc);
  return acc;
}
const rComment = t => t.replace(/\s+/g, ' ');
function rIndLine(ind) { return 'd$' + ind.id + ' <- with(d, ' + stripOuter(toR(nodeOf(ind))) + ')'; }

# Structure (100 %) d'un cote du bilan, une barre par exercice
graph_structure <- function(groupes, titre) {
  style(); par(mar = c(5.2, 4.6, 3.6, 1))

  }
  legend("bottom", inset = c(0, -0.32), legend = names(groupes), fill = pal[seq_along(groupes)], border = NA, bty = "n", cex = 0.8, ncol = 3, xpd = TRUE)
}

/* Le script R est 100 % ASCII : commentaires sans accents, accents des textes écrits \uXXXX.
   Il s'ouvre donc correctement dans RStudio, R sous Windows, posit.cloud, quel que soit l'encodage. */
const R_TRANSLIT = { '≥':'>=', '≤':'<=', '−':'-', '–':'-', '—':'-', '×':'x', '’':"'", '‘':"'", '“':'"', '”':'"', '…':'...', 'œ':'oe', 'Œ':'OE', 'æ':'ae', 'α':'alpha', '\u00a0':' ', '\u202f':' ', '«':'"', '»':'"', '·':'-', '→':'->', 'Δ':'Delta ' };
function rPlain(t) { return t.replace(/[^\x00-\x7f]/g, c => R_TRANSLIT[c] ?? c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x00-\x7f]/g, '?')); }
function rStr(t) { return String(t).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[^\x00-\x7f]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')); }
function rAscii(line) {
  let out = '', inStr = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inStr) { if (c === '\\') { out += c + (line[i + 1] ?? ''); i++; continue; } if (c === '"') inStr = false; out += c.charCodeAt(0) > 127 ? '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0') : c; continue; }
    if (c === '"') { inStr = true; out += c; continue; }
    if (c === '#') return out + rPlain(line.slice(i));
    out += c.charCodeAt(0) > 127 ? rPlain(c) : c;
  }
  return out;
}
function rScript() {
  const b = bank(), yrs = b.years, Yv = Y();
  const pad = (x, n) => x + ' '.repeat(Math.max(1, n - x.length));
  const L = [];
  L.push('# =====================================================================');
  L.push('# Analyse financière bancaire UMOA : ' + rComment(b.name));
  L.push('# Script généré par Analyste Bancaire UMOA le ' + new Date().toLocaleDateString('fr-FR'));
  L.push('# Montants en ' + rComment(b.unit) + '. Les ratios sont des proportions (0.15 = 15 %).');
  L.push('# Base des rentabilités : ' + (state.base === 'moy' ? 'moyenne N / N-1' : "fin d'exercice"));
  L.push('# Aucun package requis (R de base).');
  L.push('# =====================================================================', '');
  L.push('# 0. Fonctions utilitaires');
  L.push('lag1 <- function(x) c(NA, head(x, -1))          # valeur de l\'exercice précédent');
  L.push('si_absent <- function(x, remplacement) ifelse(is.na(x), remplacement, x)');
  L.push('moy_pos3 <- function(x) sapply(seq_along(x), function(i) {  # moyenne des valeurs > 0 sur 3 exercices');
  L.push('  v <- x[max(1, i - 2):i]; v <- v[!is.na(v) & v > 0]');
  L.push('  if (length(v)) mean(v) else NA');
  L.push('})', '');
  L.push('# 1. Données (NA = non saisi)');
  L.push('d <- data.frame(');
  const cols = ['  annee = c(' + yrs.join(', ') + ')'];
  FIELDS.forEach(f => {
    const arr = yrs.map((_, i) => { const x = b.v[f.k] && b.v[f.k][i]; return fin(x) ? rNum(x) : 'NA'; });
    cols.push(pad('  ' + rName(f.k) + ' = c(' + arr.join(', ') + ')', 52) + '# ' + rComment(f.l));
  });
  L.push(cols.map((c, i) => i < cols.length - 1 ? c.replace(/(\))(\s+#|$)/, '),$2') : c).join('\n'));
  L.push(')', '');
  L.push('# 2. Paramètres (en %, convertis en proportions)');
  L.push('p <- list(');
  L.push(PARAMS.map((pp, i) => pad('  ' + pp.k + ' = ' + rNum(state.params[pp.k]) + (i < PARAMS.length - 1 ? ',' : ''), 30) + '# ' + rComment(pp.l)).join('\n'));
  L.push(')');
  L.push('p <- lapply(p, function(x) x / 100)', '');
  L.push('# 3. Grandeurs intermédiaires');
  qtyOrder().forEach(id => { const q = QTY[id]; L.push('# ' + rComment(q.long || q.n)); L.push('d$' + id + ' <- with(d, ' + rQtyExpr(id) + ')'); });
  L.push('', '# 4. Indicateurs');
  IND.forEach(ind => { L.push('# ' + rComment(ind.n) + (ind.thr ? ' (seuil ' + (ind.thr.dir === 'min' ? '>= ' : '<= ') + state.params[ind.thr.k] + ' %)' : '')); L.push(rIndLine(ind)); });
  L.push('', '# 5. Effet de levier : décomposition de la variation du ROE');
  L.push('d$effet_rentabilite_actifs <- with(d, (roa - lag1(roa)) * lag1(mult))');
  L.push('d$effet_levier <- with(d, roa * (mult - lag1(mult)))', '');
  L.push('# 6. Résultats sur la période analysée');
  L.push('periode <- d$annee >= ' + Yv[0] + ' & d$annee <= ' + Yv[Yv.length - 1]);
  const pct = IND.filter(i => (i.fmt || 'pct') === 'pct').map(i => i.id);
  const oth = IND.filter(i => (i.fmt || 'pct') !== 'pct').map(i => i.id);
  L.push('ratios_pct <- c(' + pct.map(x => '"' + x + '"').join(', ') + ')');
  L.push('autres <- c(' + oth.map(x => '"' + x + '"').join(', ') + ')');
  L.push('resultats <- d[periode, c("annee", ratios_pct, autres)]');
  L.push('resultats[ratios_pct] <- round(100 * resultats[ratios_pct], 2)   # en %');
  L.push('resultats[autres] <- round(resultats[autres], 2)');
  L.push('tableau <- t(resultats[, -1]); colnames(tableau) <- resultats$annee');
  L.push('print(tableau)', '');
  L.push('# 7. Conformité aux seuils (TRUE = conforme)');
  const th = IND.filter(i => i.thr);
  L.push('seuils <- data.frame(');
  L.push('  indicateur = c(' + th.map(i => '"' + i.id + '"').join(', ') + '),');
  L.push('  seuil = unlist(p[c(' + th.map(i => '"' + i.thr.k + '"').join(', ') + ')]),');
  L.push('  sens = c(' + th.map(i => '"' + i.thr.dir + '"').join(', ') + ')');
  L.push(')');
  L.push('conformite <- sapply(seq_len(nrow(seuils)), function(i) {');
  L.push('  v <- d[[seuils$indicateur[i]]][periode]');
  L.push('  if (seuils$sens[i] == "min") v >= seuils$seuil[i] else v <= seuils$seuil[i]');
  L.push('})');
  L.push('conformite <- matrix(conformite, ncol = nrow(seuils), dimnames = list(d$annee[periode], seuils$indicateur))');
  L.push('print(t(conformite))', '');
  L.push(R_GRAPHS.replace('@@DOSSIER@@', 'graphiques_' + fileBase()).replace('@@TITRE@@', rStr(b.name)));
  return L.map(rAscii).join('\n');
}

const R_ESS_IDS = ['transfo', 'liq', 'levier', 'mult', 'solva_s', 'solva', 'cet1', 'levier_b', 'roa', 'roe', 'coef', 'cdr', 'pnbc', 'chute'];
/* Grandeurs, postes et paramètres dont dépendent des indicateurs */
function rDeps(ids) {
  const qs = new Set(), vs = new Set(), ps = new Set();
  const walk = n => {
    if (!n) return;
    if (n.t === 'v') vs.add(n.k); else if (n.t === 'q') addQ(n.id); else if (n.t === 'p') ps.add(n.k);
    if (n.t === 's') n.a.forEach(([, x]) => walk(x)); else if (n.a) n.a.forEach(walk);
    if (n.x) walk(n.x);
  };
  const addQ = id => { if (qs.has(id)) return; qs.add(id); const q = QTY[id]; walk(q.node); walk(q.alt); if (q.decl) vs.add(q.decl); };
  ids.forEach(id => { walk(nodeOf(I[id])); if (I[id].thr) ps.add(I[id].thr.k); });
  return { qs:qtyOrder().filter(q => qs.has(q)), vs:FIELDS.filter(f => vs.has(f.k)), ps:PARAMS.filter(p => ps.has(p.k)) };
}
const rVec = (b, k) => 'c(' + b.years.map((_, i) => { const x = b.v[k] && b.v[k][i]; return fin(x) ? rNum(x) : 'NA'; }).join(', ') + ')';
const rBar = (t, w = 66) => { const s = '# ---- ' + t + ' '; return s + '-'.repeat(Math.max(4, w - s.length)); };
const rHelpers = code => [
  /\blag1\(/.test(code) ? 'lag1 <- function(x) c(NA, head(x, -1))                  # exercice precedent' : null,
  /\bsi_absent\(/.test(code) ? 'si_absent <- function(x, sinon) ifelse(is.na(x), sinon, x)  # valeur declaree, sinon estimee' : null,
  /\bmoy_pos3\(/.test(code) ? 'moy_pos3 <- function(x) sapply(seq_along(x), function(i) {  # moyenne des valeurs > 0 sur 3 ans\n  v <- x[max(1, i - 2):i]; v <- v[!is.na(v) & v > 0]; if (length(v)) mean(v) else NA\n})' : null
].filter(Boolean);
const rThrLine = (id, nom) => { const t = I[id].thr; return 'verdict(' + JSON.stringify(nom) + ', ' + id + ', p$' + t.k + ', "' + t.dir + '")'; };

function rScriptEssentiel() {
  const b = bank(), d = rDeps(R_ESS_IDS), pad = (x, n) => x + ' '.repeat(Math.max(1, n - x.length));
  const calc = [];
  d.qs.forEach(id => calc.push(pad(id + ' <- ' + rQtyExpr(id), 54) + '# ' + rComment(QTY[id].long || QTY[id].n)));
  const ind = R_ESS_IDS.map(id => pad(id + ' <- ' + stripOuter(toR(nodeOf(I[id]))), 54) + '# ' + rComment(I[id].n));
  const helpers = rHelpers(calc.concat(ind).join('\n'));
  const L = [
    '# ==============================================================',
    '#   ' + rComment(b.name) + '  --  l\'essentiel en R',
    '#   Genere le ' + new Date().toLocaleDateString('fr-FR') + ' par Analyste Bancaire UMOA',
    '#   R de base, zero package : copie, colle, lance. C\'est tout.',
    '# ==============================================================', '',
    rBar('1. Les chiffres (' + rComment(b.unit) + ', NA = pas saisi)'),
    pad('annee <- c(' + b.years.join(', ') + ')', 54) + '# exercices',
    ...d.vs.map(f => pad(rName(f.k) + ' <- ' + rVec(b, f.k), 54) + '# ' + rComment(f.l)), '',
    rBar('2. Les reglages (en %)'),
    'p <- list(',
    d.ps.map((pp, i) => pad('  ' + pp.k + ' = ' + rNum(state.params[pp.k]) + (i < d.ps.length - 1 ? ',' : ''), 30) + '# ' + rComment(pp.l)).join('\n'),
    ')',
    'p <- lapply(p, function(x) x / 100)                        # 11.5 % devient 0.115', ''];
  if (helpers.length) L.push(rBar('3. Les petits outils'), ...helpers, '');
  L.push(rBar('4. Les grandeurs'), ...calc, '');
  L.push(rBar('5. Les ratios (proportions : 0.15 = 15 %)'), ...ind, '');
  L.push(rBar('6. Le tableau de bord (en %)'),
    'pct <- function(x) round(100 * x, 2)',
    'tableau <- data.frame(',
    '  annee,',
    ['transfo', 'liq', 'levier', 'solva_s', 'solva', 'cet1', 'levier_b', 'roa', 'roe', 'coef', 'cdr', 'chute'].map(id => '  ' + id + ' = pct(' + id + ')').join(',\n'),
    ')',
    'print(tableau, row.names = FALSE)', '');
  L.push(rBar('7. Verdict express (dernier exercice)'),
    'n <- length(annee)',
    'verdict <- function(nom, x, seuil, sens = "min") {',
    '  v <- x[n]',
    '  ok <- if (is.na(v)) NA else if (sens == "min") v >= seuil else v <= seuil',
    '  etat <- if (is.na(ok)) "  ?   " else if (ok) "  OK  " else "ALERTE"',
    '  cat(sprintf("[%s] %-34s %8.2f %%   (seuil %s %.1f %%)\\n", etat, nom, 100 * v, if (sens == "min") ">=" else "<=", 100 * seuil))',
    '}',
    'cat("\\n== Verdict", annee[n], "==\\n")',
    rThrLine('solva', 'Solvabilite globale (Bale)'), rThrLine('cet1', 'Ratio CET1'), rThrLine('levier_b', 'Levier Bale III'),
    rThrLine('liq', 'Liquidite (bilan)'), rThrLine('transfo', 'Transformation'), rThrLine('roe', 'ROE'), rThrLine('roa', 'ROA'),
    rThrLine('coef', 'Coefficient d\'exploitation'), rThrLine('cdr', 'Cout du risque / credits'),
    'if (!is.na(chute[n])) cat(if (chute[n] >= 1) "\\nFaillite : meme un PNB nul n\'effacerait pas les fonds propres en un an. Solide.\\n" else sprintf("\\nFaillite : une chute du PNB de %.1f %% suffirait a effacer les fonds propres.\\n", 100 * chute[n]))', '');
  L.push(rBar('8. Deux graphiques, et c\'est plie'),
    'op <- par(mfrow = c(1, 2), mar = c(4, 4, 3, 1), las = 1)',
    'if (any(!is.na(c(roe, roa)))) {',
    '  barplot(100 * rbind(roe, roa), beside = TRUE, names.arg = annee, col = c("#2a78d6", "#eb6834"), border = NA,',
    '          main = "Rentabilit\\u00e9 (%)", legend.text = c("ROE", "ROA"), args.legend = list(bty = "n"))',
    '  abline(h = 0, col = "grey60")',
    '}',
    'if (any(!is.na(solva))) {',
    '  barplot(100 * solva, names.arg = annee, border = NA, main = "Solvabilit\\u00e9 globale (%)",',
    '          col = ifelse(!is.na(solva) & solva >= p$seuil_solva, "#1baf7a", "#b3302a"), ylim = c(0, max(100 * c(solva, p$seuil_solva), na.rm = TRUE) * 1.2))',
    '  abline(h = 100 * p$seuil_solva, lty = 2)',
    '}',
    'par(op)');
  return L.map(rAscii).join('\n');
}

}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
/* Téléchargement de fichiers : possible sur le site déployé, bloqué dans un cadre intégré (aperçu) */
const CAN_DOWNLOAD = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
function download(name, txt, type) {
  try {
    const url = URL.createObjectURL(new Blob([txt], { type: (type || 'text/plain') + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Fichier ' + name + ' téléchargé');
  } catch (e) { toast('Téléchargement impossible : utilise le bouton Copier'); }
}
const fileBase = () => (bank().name || 'banque').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'banque';
async function copyText(txt, out) {
  try { await navigator.clipboard.writeText(txt); toast('Copié dans le presse-papiers'); }
  catch (e) { toast('Copie bloquée : sélectionne le texte ci-dessous'); }
  if (out) { out.hidden = false; out.value = txt; out.select(); }
}

  }
  if (state.tab === 'faillite' && $('#sPnb')) {
    const upd = () => { state.shock = { pnb:+$('#sPnb').value, cdr:+$('#sCdr').value }; const sim = $('#sim'); sim.outerHTML = simulator(); bindSim(); };
    const bindSim = () => { $('#sPnb').oninput = upd; $('#sCdr').oninput = upd; };
    bindSim();
  }
  if (state.tab === 'params') {
    view.querySelectorAll('input[data-p]').forEach(inp => inp.addEventListener('change', () => { const v = parseNum(inp.value); if (v === null || v < 0 || v > 1000) { toast('Valeur invalide : saisis un pourcentage entre 0 et 1000'); inp.value = state.params[inp.dataset.p]; return; } state.params[inp.dataset.p] = v; save(); track('parametres', ((PARAMS.find(p => p.k === inp.dataset.p) || {}).l || inp.dataset.p) + ' = ' + v + ' %'); toast('Paramètre appliqué'); }));
    $('#pReset').onclick = () => { state.params = Object.assign({}, DEFAULT_PARAMS); save(); renderAll(true); toast('Valeurs par défaut rétablies'); };
  }
  if (state.tab === 'historique') bindHistorique();
  if (state.tab === 'rapport') bindRapport();
  view.querySelectorAll('[data-hsave]').forEach(b => b.onclick = () => { addHistory('manuel', bank().name + ' · ' + Y()[0] + '–' + Y()[Y().length - 1], ''); track('analyse', bank().name + ' · ' + Y()[0] + '–' + Y()[Y().length - 1]); toast('Analyse enregistrée dans l’historique'); renderAll(true); });
  if (state.tab === 'r') {
    const st = () => R_STYLES.some(s => s[0] === state.rStyle) ? state.rStyle : 'complet';
    $('#rCopy').onclick = () => { copyText(rCode(st())); track('code_r', 'copie du code ' + st() + ' · ' + bank().name); };
    if ($('#rDl')) $('#rDl').onclick = () => { download(rFileName(st()), rCode(st())); track('code_r', 'téléchargement de ' + rFileName(st())); };
    view.querySelectorAll('[name="rstyle"]').forEach(r => r.addEventListener('change', () => { state.rStyle = r.value; save(); renderAll(); }));
  }
  if (state.tab === 'import') {
    $('#impParse').onclick = () => { importSource = ''; previewImport(parseImport($('#impText').value)); };
    $('#impFile').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
    $('#impCam').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
    const dz = $('#dropZone');
    ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, () => dz.classList.remove('over')));
    dz.addEventListener('drop', e => { e.preventDefault(); importFiles([...(e.dataTransfer?.files || [])]); });
    $('#expCsv').onclick = () => copyText(toCsv(false), $('#expOut'));
    $('#expTpl').onclick = () => copyText(toCsv(true), $('#expOut'));
    $('#expJson').onclick = () => copyText(JSON.stringify({ banks:state.banks, cur:state.cur, params:state.params, history:state.history }, null, 1), $('#expOut'));
    if ($('#dlCsv')) $('#dlCsv').onclick = () => track('export', 'CSV · ' + bank().name) || saveFile(fileBase() + '.csv', '\ufeff' + toCsv(false), 'text/csv');
    if ($('#dlJson')) $('#dlJson').onclick = () => track('export', 'sauvegarde JSON complète') || saveFile('sauvegarde_analyste_umoa.json', JSON.stringify({ banks:state.banks, cur:state.cur, params:state.params, history:state.history }, null, 1), 'application/json');
  }
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  const from = state.tab;
  state.tab = b.dataset.tab; state.yi = 99; save(); renderAll(); window.scrollTo(0, 0);
  if (state.tab !== from) track('onglet', (TABS.find(t => t[0] === state.tab) || [, state.tab])[1]);
});
$('#bankSel').addEventListener('change', e => { state.cur = e.target.value; state.yi = 99; save(); renderAll(); track('banque', bank().name); });
$('#yearSel').addEventListener('change', e => { state.yi = +e.target.value; renderAll(true); });
function setRange() {
  const b = bank(), a = +$('#fromSel').value, z = +$('#toSel').value;
  b.range = [Math.min(a, z), Math.max(a, z)];
  if (b.range[0] === b.years[0] && b.range[1] === b.years[b.years.length - 1]) delete b.range;
  state.yi = Y().length - 1; save(); renderAll(true);
}
$('#fromSel').addEventListener('change', setRange);
$('#toSel').addEventListener('change', setRange);

/* Info-bulles (survol, focus, toucher) */
const tip = $('#tip');
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive:true });

// lien direct vers l'administration : /admin ou #admin
// ancienne adresse de la console : elle est maintenant une page à part
if (location.hash === '#admin') location.replace('/admin');
renderAll();
accountBoot();
</script>
