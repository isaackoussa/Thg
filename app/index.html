<title>Analyste Bancaire UMOA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout : en-tête collant façon registre (banque, exercice, onglets) + colonne de fiches indicateurs, 2 colonnes au-delà de 900px */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #e8ede8;
  --ink: #13201a;
  --ink-2: #45524b;
  --ink-3: #6b7770;
  --line: #d3dbd5;
  --accent: #0c5a48;
  --accent-soft: #d9ebe3;
  --on-accent: #ffffff;
  --ok: #1a7642; --ok-bg: #e0f1e6;
  --warn: #8f5500; --warn-bg: #f9edd6;
  --bad: #b3302a; --bad-bg: #fae2df;
  --na: #6b7770; --na-bg: #eaedea;
  --s1: #2a78d6; --s1-soft: #86b6ef; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171d1a; --surface-2: #1f2724; --ink: #ecf1ee; --ink-2: #b3bdb7; --ink-3: #87928c; --line: #2c3632;
    --accent: #58c2a2; --accent-soft: #19332b; --on-accent: #07211a;
    --ok: #52c784; --ok-bg: #133022; --warn: #e4a840; --warn-bg: #36280f; --bad: #f2786d; --bad-bg: #3a1a17; --na: #87928c; --na-bg: #222a27;
    --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171d1a; --surface-2: #1f2724; --ink: #ecf1ee; --ink-2: #b3bdb7; --ink-3: #87928c; --line: #2c3632;
  --accent: #58c2a2; --accent-soft: #19332b; --on-accent: #07211a;
  --ok: #52c784; --ok-bg: #133022; --warn: #e4a840; --warn-bg: #36280f; --bad: #f2786d; --bad-bg: #3a1a17; --na: #87928c; --na-bg: #222a27;
  --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tabnum { font-variant-numeric: tabular-nums; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: grid; gap: 8px; }
.top-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mark { font-family: var(--f-display); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.12em; background: var(--accent); color: var(--on-accent); padding: 5px 7px; border-radius: 4px; }
.bank-name { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
.sub { color: var(--ink-3); font-size: 0.82rem; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrls label { display: flex; flex-direction: column; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); gap: 2px; }
select, input[type="text"], input[type="number"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.ctrls select { min-width: 0; max-width: 46vw; }
#bankSel { max-width: 60vw; }
@media (max-width: 700px) { .top { position: static; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 9px; font-weight: 600; color: var(--ink-2); white-space: nowrap; cursor: pointer; font-size: 0.92rem; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 22px; }
.section-head { display: grid; gap: 4px; }
.lede { color: var(--ink-2); max-width: 70ch; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 > * { min-width: 0; }

/* Fiches */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.card-h .t { display: grid; gap: 3px; min-width: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.tag.reg { color: var(--accent); border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip i { font-style: normal; font-weight: 800; }
.st-ok { color: var(--ok); background: var(--ok-bg); }
.st-warn { color: var(--warn); background: var(--warn-bg); }
.st-bad { color: var(--bad); background: var(--bad-bg); }
.st-na, .st-info { color: var(--na); background: var(--na-bg); }
.results { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.res { padding: 8px 10px; display: grid; gap: 1px; border-left: 1px solid var(--line); }
.res:first-child { border-left: 0; }
.res .y { font-size: 0.72rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.04em; }
.res .v { font-family: var(--f-display); font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.res.sel { background: var(--accent-soft); }
.res .s { font-size: 0.72rem; font-weight: 600; }
.formula { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; overflow-x: auto; }
.f-line { font-family: var(--f-math); font-size: 1.04rem; line-height: 1.9; display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.3em; }
.f-line .lbl { font-family: var(--f-body); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; width: 100%; line-height: 1.3; }
.f-res { font-weight: 600; color: var(--accent); }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.15em; max-width: 100%; }
.frac > .n { border-bottom: 1px solid currentColor; padding: 0 0.35em 0.05em; line-height: 1.5; }
.frac > .d { padding: 0.05em 0.35em 0; line-height: 1.5; }
.q { font-style: italic; }
.v-num { font-variant-numeric: tabular-nums; }
.miss { font-size: 0.85rem; color: var(--warn); }
.note { font-size: 0.82rem; color: var(--ink-3); }
.interp { color: var(--ink); max-width: 75ch; }
.interp b { font-weight: 600; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 0.86rem; font-weight: 600; }
details > div { margin-top: 6px; color: var(--ink-2); font-size: 0.9rem; display: grid; gap: 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); }

/* Synthèse */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
.tile .v { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .d { font-size: 0.8rem; color: var(--ink-3); }
.lists { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .lists { grid-template-columns: 1fr 1fr; } }
.lists ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 210px; }
thead th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
tr.tot td { font-weight: 700; background: var(--surface-2); }
tr.sub td:first-child { padding-left: 24px; color: var(--ink-2); }
tr.sec td { font-family: var(--f-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--surface); padding-top: 12px; }
td.up { color: var(--ok); }
td.down { color: var(--bad); }
td.muted { color: var(--ink-3); }
.code { font-size: 0.7rem; color: var(--ink-3); font-weight: 600; margin-right: 6px; }

/* Saisie */
.form-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.form-sec > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.inp-tbl { overflow-x: auto; }
.inp-tbl table td { padding: 3px 6px; }
.inp-tbl input { width: 100%; min-width: 92px; text-align: right; padding: 5px 6px; font-variant-numeric: tabular-nums; }
.inp-tbl input.bad { border-color: var(--bad); }
.inp-tbl td.calc { font-weight: 700; padding-right: 12px; }
.checks { display: grid; gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { color: var(--on-accent); filter: brightness(1.08); }
.btn.sm { padding: 3px 9px; font-size: 0.82rem; }
.btn.danger { color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.meta-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.meta-grid label { display: grid; gap: 3px; font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
.yr-pill { display: inline-flex; gap: 4px; align-items: center; }
.yr-pill input { width: 84px; }
.confirm { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
textarea { width: 100%; min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.banner.warn { background: var(--warn-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.params { display: grid; gap: 8px; }
.param { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.param .pl { display: grid; }
.param .pl span { font-size: 0.8rem; color: var(--ink-3); }
.param input { text-align: right; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.slider { display: grid; gap: 4px; }
.slider input { width: 100%; accent-color: var(--accent); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 60; }
.method-list { display: grid; gap: 10px; }
.rcode { margin: 0; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.5; white-space: pre; max-height: 70vh; }
.method-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) { .card, .tile { transition: border-color .15s; } }
</style>

<div class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand">
        <span class="mark">UMOA</span>
        <div style="min-width:0">
          <div class="bank-name" id="hdrBank"></div>
          <div class="sub" id="hdrSub"></div>
        </div>
      </div>
      <div class="ctrls">
        <label for="bankSel">Banque<select id="bankSel"></select></label>
        <label for="fromSel">Période : du<select id="fromSel"></select></label>
        <label for="toSel">au<select id="toSel"></select></label>
        <label for="yearSel">Année détaillée<select id="yearSel"></select></label>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</div>
<main id="view"></main>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* =====================================================================
   1. PLAN DE COMPTES — PCB révisé UMOA (format du fascicule BCEAO)
   ===================================================================== */
const FIELDS = [
  ['actif','A1','Caisse, banque centrale, CCP',['CAISSE BANQUE CENTRALE CCP','CAISSE BANQUES CENTRALES CCP']],
  ['actif','A2','Effets publics et valeurs assimilées',['EFFETS PUBLICS ET VALEURS ASSIMILEES']],
  ['actif','A3','Créances interbancaires et assimilées',['CREANCES INTERBANCAIRES ET ASSIMILEES','CREANCES INTERBANCAIRES']],
  ['actif','A4','Créances sur la clientèle',['CREANCES SUR LA CLIENTELE']],
  ['actif','A5','Obligations et autres titres à revenu fixe',['OBLIGATIONS ET AUTRES TITRES A REVENU FIXE']],
  ['actif','A6','Actions et autres titres à revenu variable',['ACTIONS ET AUTRES TITRES A REVENU VARIABLE']],
  ['actif','A7','Actionnaires ou associés',['ACTIONNAIRES OU ASSOCIES']],
  ['actif','A8','Autres actifs',['AUTRES ACTIFS']],
  ['actif','A9','Comptes de régularisation (actif)',['COMPTES DE REGULARISATION']],
  ['actif','A10','Participations et autres titres détenus à long terme',['PARTICIPATIONS ET AUTRES TITRES DETENUS A LONG TERME']],
  ['actif','A11','Parts dans les entreprises liées',['PARTS DANS LES ENTREPRISES LIEES']],
  ['actif','A12','Prêts subordonnés',['PRETS SUBORDONNES']],
  ['actif','A13','Immobilisations incorporelles',['IMMOBILISATIONS INCORPORELLES']],
  ['actif','A14','Immobilisations corporelles',['IMMOBILISATIONS CORPORELLES']],
  ['passif','P1','Banque centrale, CCP',['BANQUE CENTRALE CCP','BANQUES CENTRALES CCP']],
  ['passif','P2','Dettes interbancaires et assimilées',['DETTES INTERBANCAIRES ET ASSIMILEES','DETTES INTERBANCAIRES']],
  ['passif','P3',"Dettes à l'égard de la clientèle",['DETTES A L EGARD DE LA CLIENTELE']],
  ['passif','P4','Dettes représentées par un titre',['DETTES REPRESENTEES PAR UN TITRE']],
  ['passif','P5','Autres passifs',['AUTRES PASSIFS']],
  ['passif','P6','Comptes de régularisation (passif)',['COMPTES DE REGULARISATION']],
  ['passif','P7','Provisions',['PROVISIONS']],
  ['passif','P8','Emprunts et titres émis subordonnés',['EMPRUNTS ET TITRES EMIS SUBORDONNES']],
  ['cp','P9a','Capital souscrit',['CAPITAL SOUSCRIT']],
  ['cp','P9b','Primes liées au capital',['PRIMES LIEES AU CAPITAL']],
  ['cp','P9c','Réserves',['RESERVES']],
  ['cp','P9d','Écarts de réévaluation',['ECARTS DE REEVALUATION']],
  ['cp','P9e','Provisions réglementées',['PROVISIONS REGLEMENTEES']],
  ['cp','P9f','Report à nouveau (+/−)',['REPORT A NOUVEAU']],
  ['cp','P9g',"Résultat de l'exercice (+/−)",['RESULTAT DE L EXERCICE']],
  ['hb','HB1','Engagements de financement donnés',['ENGAGEMENTS DE FINANCEMENT'],'donnes'],
  ['hb','HB2','Engagements de garantie donnés',['ENGAGEMENTS DE GARANTIE'],'donnes'],
  ['hb','HB3','Engagements sur titres donnés',['ENGAGEMENTS SUR TITRES'],'donnes'],
  ['hb','HB4','Engagements de financement reçus',['ENGAGEMENTS DE FINANCEMENT'],'recus'],
  ['hb','HB5','Engagements de garantie reçus',['ENGAGEMENTS DE GARANTIE'],'recus'],
  ['hb','HB6','Engagements sur titres reçus',['ENGAGEMENTS SUR TITRES'],'recus'],
  ['cr','R1','Intérêts et produits assimilés',['INTERETS ET PRODUITS ASSIMILES']],
  ['cr','R2','Intérêts et charges assimilées',['INTERETS ET CHARGES ASSIMILEES']],
  ['cr','R3','Revenus des titres à revenu variable',['REVENUS DES TITRES A REVENU VARIABLE']],
  ['cr','R4','Commissions (produits)',['COMMISSIONS PRODUITS']],
  ['cr','R5','Commissions (charges)',['COMMISSIONS CHARGES']],
  ['cr','R6','Gains ou pertes nets sur portefeuilles de négociation',['GAINS OU PERTES NETS SUR OPERATIONS DES PORTEFEUILLES DE NEGOCIATION','GAINS OU PERTES NETS SUR OPERATIONS DU PORTEFEUILLE DE NEGOCIATION']],
  ['cr','R7','Gains ou pertes nets sur portefeuilles de placement',['GAINS OU PERTES NETS SUR OPERATIONS DES PORTEFEUILLES DE PLACEMENT','GAINS OU PERTES NETS SUR OPERATIONS DU PORTEFEUILLE DE PLACEMENT']],
  ['cr','R8',"Autres produits d'exploitation bancaire",['AUTRES PRODUITS D EXPLOITATION BANCAIRE']],
  ['cr','R9',"Autres charges d'exploitation bancaire",['AUTRES CHARGES D EXPLOITATION BANCAIRE']],
  ['cr','R10',"Subventions d'investissement",['SUBVENTIONS D INVESTISSEMENT']],
  ['cr','R11',"Charges générales d'exploitation",['CHARGES GENERALES D EXPLOITATION']],
  ['cr','R12','Dotations aux amortissements et dépréciations des immobilisations',['DOTATIONS AUX AMORTISSEMENTS']],
  ['cr','R13','Coût du risque (charge nette, + = charge)',['COUT DU RISQUE']],
  ['cr','R14','Gains ou pertes nets sur actifs immobilisés',['GAINS OU PERTES NETS SUR ACTIFS IMMOBILISES']],
  ['cr','R15','Impôts sur les bénéfices',['IMPOTS SUR LES BENEFICES']],
  ['prud','CET1','Fonds propres de base durs (CET1) déclarés',[]],
  ['prud','T1','Fonds propres de base T1 (CET1 + AT1) déclarés',[]],
  ['prud','FPE','Fonds propres effectifs totaux déclarés',[]],
  ['prud','RWA','Actifs pondérés par les risques (RWA) déclarés',[]],
  ['prud','EXPL',"Exposition de levier déclarée",[]],
  ['prud','LIQA','Actifs disponibles et réalisables à ≤ 3 mois',[]],
  ['prud','LIQP','Passifs exigibles à ≤ 3 mois',[]],
  ['prud','HQLA','Actifs liquides de haute qualité (HQLA)',[]],
  ['prud','SNT','Sorties nettes de trésorerie à 30 jours',[]],
  ['prud','RSTAB','Ressources stables',[]],
  ['prud','EMLT','Emplois à moyen et long terme',[]]

const LS_KEY = 'umoa-analyste-v1';
function normBank(b) {
  b.years = (b.years || []).map(Number);
  b.v = b.v || {};
  Object.keys(b.v).forEach(k => { const a = b.v[k] || []; b.v[k] = b.years.map((_, i) => (typeof a[i] === 'number' && Number.isFinite(a[i])) ? a[i] : null); });
  const order = b.years.map((y, i) => [y, i]).sort((x, z) => x[0] - z[0]).map(x => x[1]);
  if (order.some((o, i) => o !== i)) { b.years = order.map(i => b.years[i]); Object.keys(b.v).forEach(k => { b.v[k] = order.map(i => b.v[k][i]); }); }
  return b;
}
const clone = o => JSON.parse(JSON.stringify(o));
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || !s.banks || !Object.keys(s.banks).length) s = { banks:{ bab: clone(SAMPLE) }, cur:'bab' };
  s.params = Object.assign({}, DEFAULT_PARAMS, s.params || {});
  s.base = s.base || 'fin';
  s.tab = s.tab || 'synthese';
  if (!s.banks[s.cur]) s.cur = Object.keys(s.banks)[0];
  Object.values(s.banks).forEach(normBank);
  return s;
}

  const b = bank(), n = b.years.length;
  if (state.tab === 'saisie' || state.tab === 'import' || !b.range) return [0, n - 1];
  let a = b.years.indexOf(b.range[0]), z = b.years.indexOf(b.range[1]);
  if (a < 0) a = 0; if (z < 0) z = n - 1; if (a > z) [a, z] = [z, a];
  return [a, z];
}

  let pos = b.years.findIndex(y => y > yr); if (pos < 0) pos = b.years.length;

  Object.keys(b.v).forEach(k => b.v[k].splice(pos, 0, null));

}

function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[\s  ]/g, '').replace(/−/g, '-');
  if (s === '' || s === '-') return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const v = Number(s);
  return Number.isFinite(v) ? (neg ? -v : v) : null;
}
const fin = v => typeof v === 'number' && Number.isFinite(v);
const nfI = new Intl.NumberFormat('fr-FR', { maximumFractionDigits:0 });
const nf = d => new Intl.NumberFormat('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d });
const fmtM = v => fin(v) ? nfI.format(Math.round(v)).replace(/^-/, '−') : '—';
const fmtP = (v, d = 2) => fin(v) ? nf(d).format(v * 100).replace(/^-/, '−') + ' %' : '—';
const fmtX = v => fin(v) ? nf(2).format(v).replace(/^-/, '−') + ' ×' : '—';
const fmtPts = (d) => fin(d) ? (d >= 0 ? '+' : '−') + nf(2).format(Math.abs(d * 100)) + ' pt' : '—';
const fmtSigned = v => fin(v) ? (v >= 0 ? '+' : '−') + nfI.format(Math.abs(Math.round(v))) : '—';
const fmtBy = (f, v) => f === 'm' ? fmtM(v) : f === 'x' ? fmtX(v) : fmtP(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* =====================================================================
   6. MOTEUR DE FORMULES — une formule = un arbre, utilisé pour calculer ET afficher
   ===================================================================== */
const V = (k, off = 0) => ({ t:'v', k, off });
const Q = (id, off = 0) => ({ t:'q', id, off });
const C = (v, lbl) => ({ t:'c', v, lbl });
const P = k => ({ t:'p', k });
const MUL = (a, b) => ({ t:'*', a:[a, b] });
const DIV = (n, d) => ({ t:'/', a:[n, d] });
const M3 = x => ({ t:'m3', x });
function S(...items) {
  return { t:'s', a: items.map(it => {
    if (Array.isArray(it)) return it;
    const sg = it[0] === '-' ? -1 : 1, r = it.slice(1);
    return [sg, r.startsWith('q:') ? Q(r.slice(2)) : V(r)];
  }) };
}
function shift(n, d) {
  if (n.t === 'v' || n.t === 'q') return Object.assign({}, n, { off: n.off + d });
  if (n.t === 's') return { t:'s', a: n.a.map(([s, x]) => [s, shift(x, d)]) };
  if (n.a) return Object.assign({}, n, { a: n.a.map(x => shift(x, d)) });
  if (n.x) return Object.assign({}, n, { x: shift(n.x, d) });
  return n;
}
const AVG = x => DIV(S([1, x], [1, shift(x, -1)]), C(2));
const base = q => state.base === 'moy' ? AVG(Q(q)) : Q(q);

const ZERO_OK = new Set();
function raw(k, y) {
  const a = bank().v[k];
  if (!a) return null;
  const x = a[y + OFF()];
  return fin(x) ? x : null;
}
function newCtx() { return { miss:new Set(), notes:new Set(), decl:new Set(), est:new Set() }; }
function mergeCtx(a, b) { b.miss.forEach(x => a.miss.add(x)); b.notes.forEach(x => a.notes.add(x)); b.decl.forEach(x => a.decl.add(x)); b.est.forEach(x => a.est.add(x)); }

function ev(n, y, ctx) {
  switch (n.t) {
    case 'v': {
      const yy = y + n.off;
      if (yy + OFF() < 0) { ctx.notes.add('Exercice précédent indisponible pour ' + yearAt(y)); return NaN; }
      const x = raw(n.k, yy);
      if (x === null) { ctx.miss.add(n.k); return NaN; }
      return x;
    }
    case 'c': return n.v;
    case 'p': return (state.params[n.k] ?? DEFAULT_PARAMS[n.k]) / 100;
    case 'q': return evQ(n.id, y + n.off, ctx);
    case 's': return n.a.reduce((acc, [sg, x]) => acc + sg * ev(x, y, ctx), 0);
    case '*': return ev(n.a[0], y, ctx) * ev(n.a[1], y, ctx);
    case '/': { const a = ev(n.a[0], y, ctx), b = ev(n.a[1], y, ctx); return b === 0 ? NaN : a / b; }
    case 'm3': {
      const vals = [];
      for (let k = 0; k < 3; k++) { if (y - k + OFF() < 0) break; const c2 = newCtx(); const v = ev(shift(n.x, -k), y, c2); if (fin(v) && v > 0) vals.push(v); else if (k === 0) mergeCtx(ctx, c2); }
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
    }
  }
  return NaN;
}
function evQ(id, y, ctx) {
  const q = QTY[id];
  if (y + OFF() < 0) { ctx.notes.add('Exercice précédent indisponible'); return NaN; }
  if (q.decl && raw(q.decl, y) !== null) { ctx.decl.add(id); return raw(q.decl, y); }
  if (q.decl) ctx.est.add(id);
  const c1 = newCtx();
  const v = ev(q.node, y, c1);
  if (fin(v) || !q.alt) { mergeCtx(ctx, c1); return v; }
  const c2 = newCtx();
  const v2 = ev(q.alt, y, c2);
  if (fin(v2)) { mergeCtx(ctx, c2); ctx.notes.add(q.altNote); return v2; }
  mergeCtx(ctx, c1); mergeCtx(ctx, c2);
  return NaN;
}
const calc = (node, y) => { const c = newCtx(); const v = ev(node, y, c); return { v, c }; };
const val = (node, y) => calc(node, y).v;
const qv = (id, y) => val(Q(id), y);

/* Rendu : mode 'sym' (libellés) ou 'num' (valeurs de l'exercice y) */
function wrapIf(n, html) { return (n.t === 's' && n.a.length > 1) ? '(' + html + ')' : html; }
function R(n, mode, y) {
  switch (n.t) {
    case 'v': {
      const lab = (SHORT[n.k] || F[n.k].l) + (n.off ? ' <sub>N' + n.off + '</sub>' : '');
      if (mode === 'sym') return '<span title="' + esc(F[n.k].l) + '">' + lab + '</span>';
      const x = (y + n.off + OFF() >= 0) ? raw(n.k, y + n.off) : null;
      return x === null ? '<span class="miss">?</span>' : '<span class="v-num" data-tip="' + esc(F[n.k].l + ' ' + (yearAt(y + n.off) || '')) + '">' + (x < 0 ? '(' + fmtM(x) + ')' : fmtM(x)) + '</span>';
    }
    case 'c': return n.lbl || nf(n.v % 1 ? 1 : 0).format(n.v);
    case 'p': {
      const p = PARAMS.find(p => p.k === n.k);
      return '<span data-tip="' + esc(p ? p.l : n.k) + ' (modifiable dans Paramètres)">' + nf((state.params[n.k] % 1) ? 1 : 0).format(state.params[n.k]) + ' %</span>';
    }
    case 'q': {
      const q = QTY[n.id];
      const lab = '<span class="q">' + q.n + '</span>' + (n.off ? ' <sub>N' + n.off + '</sub>' : '');
      if (mode === 'sym') return '<span data-tip="' + esc(q.long || q.n) + '">' + lab + '</span>';
      const v = (y + n.off + OFF() >= 0) ? qv(n.id, y + n.off) : NaN;
      return '<span class="v-num" data-tip="' + esc((q.long || q.n) + ' ' + (yearAt(y + n.off) || '')) + '">' + (fin(v) ? (v < 0 ? '(' + fmtM(v) + ')' : fmtM(v)) : '<span class="miss">?</span>') + '</span>';
    }
    case 's': return n.a.map(([sg, x], i) => (i === 0 ? (sg < 0 ? '− ' : '') : (sg < 0 ? ' − ' : ' + ')) + wrapIf(x, R(x, mode, y))).join('');
    case '*': return n.a.map(x => wrapIf(x, R(x, mode, y))).join(' × ');
    case '/': return '<span class="frac"><span class="n">' + R(n.a[0], mode, y) + '</span><span class="d">' + R(n.a[1], mode, y) + '</span></span>';
    case 'm3': {
      if (mode === 'sym') return 'moyenne<sub>3 ans</sub>(' + R(n.x, mode, y) + ' &gt; 0)';
      const parts = [];
      for (let k = 2; k >= 0; k--) if (y - k + OFF() >= 0) { const v = val(shift(n.x, -k), y); parts.push(fin(v) ? fmtM(v) : '?'); }
      return 'moy(' + parts.join(' ; ') + ')';
    }
  }

}

   9. STATUTS & INTERPRÉTATION
   ===================================================================== */
const ST_LABEL = { ok:['✓','Conforme'], warn:['!','Marge faible'], bad:['✕','Non conforme'], na:['–','Non calculé'], info:['·','Information'] };
function thrVal(ind) { return ind.thr ? (state.params[ind.thr.k] ?? DEFAULT_PARAMS[ind.thr.k]) / 100 : null; }
function status(ind, v) {
  if (!fin(v)) return 'na';
  if (!ind.thr) return 'info';
  const s = thrVal(ind), m = (state.params.marge ?? 10) / 100;
  if (ind.thr.dir === 'min') return v < s ? 'bad' : v < s * (1 + m) ? 'warn' : 'ok';
  return v > s ? 'bad' : v > s * (1 - m) ? 'warn' : 'ok';
}
function stLabel(ind, st) {
  if (st === 'ok') return ind.thr && !ind.thr.reg ? 'Dans le repère' : 'Conforme';
  if (st === 'bad') return ind.thr && !ind.thr.reg ? 'Hors repère' : 'Non conforme';
  return ST_LABEL[st][1];
}
const chip = (ind, st) => '<span class="chip st-' + st + '"><i aria-hidden="true">' + ST_LABEL[st][0] + '</i>' + stLabel(ind, st) + '</span>';

function series(ind) { return Y().map((_, y) => val(nodeOf(ind), y)); }
function interpret(ind, vals) {
  const yrs = Y(), f = ind.fmt || 'pct', out = [];
  const idx = vals.map((v, i) => fin(v) ? i : -1).filter(i => i >= 0);
  if (!idx.length) return '';
  const first = idx[0], last = idx[idx.length - 1];
  const fmtD = (a, b) => f === 'pct' ? fmtPts(b - a) : f === 'x' ? (b - a >= 0 ? '+' : '−') + nf(2).format(Math.abs(b - a)) : fmtSigned(b - a) + ' M';
  if (first !== last) {
    let s = 'Passe de <b>' + fmtBy(f, vals[first]) + '</b> en ' + yrs[first] + ' à <b>' + fmtBy(f, vals[last]) + '</b> en ' + yrs[last] + ' (' + fmtD(vals[first], vals[last]) + ')';
    if (idx.length >= 3) {
      const w = d => d > 0 ? 'hausse' : d < 0 ? 'baisse' : 'stabilité';
      const steps = idx.slice(1).map((i, j) => [w(vals[i] - vals[idx[j]]), yrs[i]]);
      s += steps.every(x => x[0] === steps[0][0]) ? ', ' + steps[0][0] + ' continue sur la période' : ', avec ' + steps.map(([d, yr]) => 'une ' + d + ' en ' + yr).join(', ').replace(/, (?=[^,]*$)/, ' puis ');
    }
    out.push(s + '.');
    const rel = Math.abs(vals[last] - vals[first]) / (Math.abs(vals[first]) || 1);
    if (rel > 0.02 && ind.up && ind.down) out.push(vals[last] > vals[first] ? ind.up : ind.down);
  } else out.push('Valeur ' + yrs[last] + ' : <b>' + fmtBy(f, vals[last]) + '</b>.');
  if (ind.thr) {
    const s = thrVal(ind), v = vals[last], st = status(ind, v);
    const sl = ind.thr.reg ? 'le minimum réglementaire' : 'le repère', sv = fmtP(s, 1);
    if (ind.thr.dir === 'min') {
      if (st === 'bad') out.push('En ' + yrs[last] + ', le ratio est <b>sous ' + sl + ' de ' + sv + '</b> (écart ' + fmtPts(v - s) + ').');
      else if (st === 'warn') out.push('Au-dessus de ' + sl + ' de ' + sv + ' mais avec une marge faible (' + fmtPts(v - s) + ').');
      else out.push('Confortablement au-dessus de ' + sl + ' de ' + sv + ' (marge ' + fmtPts(v - s) + ').');
    } else {
      if (st === 'bad') out.push('En ' + yrs[last] + ', le ratio <b>dépasse ' + (ind.thr.reg ? 'le plafond réglementaire' : 'le repère') + ' de ' + sv + '</b>.');
      else if (st === 'warn') out.push('Sous le plafond de ' + sv + ' mais proche de celui-ci.');
      else out.push('Nettement sous le plafond de ' + sv + '.');
    }
  }
  if (ind.story) out.push(ind.story(vals));
  return out.join(' ');
}
I.pnbc.story = vals => {
  const y = Y().length - 1, pnb = qv('PNB', y), v = vals[y];
  if (!fin(v) || !fin(pnb)) return '';
  if (v <= 0) return 'Même avec un PNB nul, les charges ne suffiraient pas à effacer les capitaux propres en un exercice : la banque encaisserait la disparition totale de ses revenus pendant un an.';
  return 'En ' + Y()[y] + ', le PNB devrait tomber de ' + fmtM(pnb) + ' à ' + fmtM(v) + ' M pour que la perte efface les capitaux propres.';
};
I.chute.story = vals => {
  const y = Y().length - 1; if (!fin(vals[y])) return '';

};
I.abs_c.story = vals => { const y = Y().length - 1; return fin(vals[y]) ? 'Il suffirait que ' + fmtP(vals[y], 1) + ' des crédits clientèle soient perdus pour effacer les fonds propres.' : ''; };
I.lmax.story = vals => { const y = Y().length - 1; return fin(vals[y]) ? (vals[y] < 0 ? 'La banque est déjà sous le seuil : il lui manque ' + fmtM(-vals[y]) + ' M de fonds propres.' : 'Au-delà de ' + fmtM(vals[y]) + ' M de pertes, la banque passe sous le minimum de solvabilité UMOA.') : ''; };

   10. GRAPHIQUES (SVG, aux couleurs du thème)
   ===================================================================== */
function barChart(ind, vals) {
  const W = 320, H = 132, pl = 8, pr = 8, pt = 14, pb = 22;
  const f = ind.fmt || 'pct', thr = thrVal(ind);
  const fv = vals.filter(fin);
  if (!fv.length) return '';
  let lo = Math.min(0, ...fv), hi = Math.max(0, ...fv, thr ?? 0);
  if (hi === lo) hi = lo + 1;
  hi += (hi - lo) * 0.12;
  const sy = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const n = vals.length, bw = Math.min(54, (W - pl - pr) / n * 0.62), gap = (W - pl - pr - n * bw) / (n + 1);
  let g = '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + sy(0) + '" y2="' + sy(0) + '" style="stroke:var(--line)" stroke-width="1"/>';
  vals.forEach((v, i) => {
    const x = pl + gap + i * (bw + gap);
    if (fin(v)) {
      const y0 = sy(0), y1 = sy(v), top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y0 - y1));
      const r = Math.min(4, h / 2);
      const up = v >= 0;
      const d = up
        ? 'M' + x + ',' + (top + h) + ' V' + (top + r) + ' Q' + x + ',' + top + ' ' + (x + r) + ',' + top + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + ' V' + (top + h) + ' Z'
        : 'M' + x + ',' + top + ' V' + (top + h - r) + ' Q' + x + ',' + (top + h) + ' ' + (x + r) + ',' + (top + h) + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + (top + h) + ' ' + (x + bw) + ',' + (top + h - r) + ' V' + top + ' Z';
      g += '<path d="' + d + '" style="fill:var(' + (i === state.yi ? '--s1' : '--s1-soft') + ')" data-tip="' + Y()[i] + ' : ' + esc(fmtBy(f, v)) + '"/>';
      g += '<rect x="' + (x - gap / 2) + '" y="' + pt + '" width="' + (bw + gap) + '" height="' + (H - pt - pb) + '" style="fill:transparent" data-tip="' + Y()[i] + ' : ' + esc(fmtBy(f, v)) + '"/>';
    }
    g += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="' + (n > 6 ? 9 : 11) + '" style="fill:var(--ink-3)">' + Y()[i] + '</text>';
  });
  if (thr != null && f === 'pct') {
    const ty = sy(thr);
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ty + '" y2="' + ty + '" style="stroke:var(--ink-2)" stroke-width="1.25" stroke-dasharray="4 3"/>';
    g += '<text x="' + (W - pr) + '" y="' + (ty - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--ink-2)">' + (ind.thr.reg ? 'seuil ' : 'repère ') + esc(fmtP(thr, 1)) + '</text>';
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ind.n) + ' par exercice">' + g + '</svg>';
}
const STRUCT = {
  actif: [ ['Trésorerie & interbancaire', ['A1','A3']], ['Titres', ['A2','A5','A6']], ['Crédits clientèle', ['A4']], ['Immobilisations & participations', ['A10','A11','A12','A13','A14']], ['Autres', ['A7','A8','A9']] ],
  passif: [ ['Interbancaire & BCEAO', ['P1','P2']], ['Dépôts clientèle', ['P3']], ['Autres dettes & provisions', ['P4','P5','P6','P7']], ['Subordonnés', ['P8']], ['Capitaux propres', CPK] ]
};
function stackChart(kind) {
  const groups = STRUCT[kind], W = 340, rowH = 26, gapR = 12, pl = 40, H = Y().length * (rowH + gapR) + 4;
  let g = '';
  Y().forEach((yr, y) => {
    const parts = groups.map(([, ks]) => ks.reduce((a, k) => a + (raw(k, y) ?? 0), 0));
    const tot = parts.reduce((a, b) => a + b, 0);

    g += '<text x="0" y="' + (ty + rowH / 2 + 4) + '" font-size="11.5" style="fill:var(--ink-2)">' + yr + '</text>';
    if (tot <= 0) return;
    let x = pl;
    const avail = W - pl - (groups.length - 1) * 2;
    parts.forEach((p, i) => {
      const w = Math.max(0, p / tot * avail);
      if (w > 0) g += '<rect x="' + x + '" y="' + ty + '" width="' + w + '" height="' + rowH + '" rx="' + Math.min(3, w / 2) + '" style="fill:var(--s' + (i + 1) + ')" data-tip="' + yr + ' · ' + esc(groups[i][0]) + ' : ' + fmtM(p) + ' M (' + fmtP(p / tot, 1) + ')"/>';

  return leg + '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Structure du ' + kind + ' par exercice">' + g + '</svg>';

function splitNumbers(tokens, want = 3) {
  const isLead = t => /^[-−(]?\d{1,3}\)?$/.test(t) && !(t.length > 1 && /^0/.test(t.replace(/^[-−(]/, '')));
  const best = { score:Infinity, parts:null };
  const rec = (i, parts) => {
    if (parts.length > want) return;
    if (i === tokens.length) {
      if (parts.length === want) {
        const vals = parts.map(p => parseNum(p.join('')));
        if (vals.some(v => v === null)) return;
        let sc = 0; for (let j = 1; j < vals.length; j++) sc += Math.abs(Math.log10(Math.abs(vals[j]) + 1) - Math.log10(Math.abs(vals[j - 1]) + 1));
        if (sc < best.score) { best.score = sc; best.parts = vals; }
      }
      return;
    }
    if (!isLead(tokens[i]) && !/^[-−(]?\d+[)]?$/.test(tokens[i])) return;
    for (let j = i + 1; j <= tokens.length; j++) {
      const grp = tokens.slice(i, j);
      if (j > i + 1 && !/^\d{3}\)?$/.test(tokens[j - 1])) break;
      if (j > i + 1 && !isLead(tokens[i])) break;
      rec(j, parts.concat([grp]));
    }
  };
  rec(0, []);
  return best.parts;
}

}

const rName = k => F[k].s === 'prud' ? k + '_decl' : k;

const rNum = v => String(Math.round(v * 1e6) / 1e6);
function toR(n) {

    case 'v': return rLag(rName(n.k), -n.off);
    case 'q': return rLag(n.id, -n.off);
    case 'c': return rNum(n.v);
    case 'p': return 'p$' + n.k;
    case 's': { const t = n.a.map(([sg, x], i) => (i === 0 ? (sg < 0 ? '-' : '') : (sg < 0 ? ' - ' : ' + ')) + toR(x)).join(''); return n.a.length > 1 ? '(' + t + ')' : t; }
    case '*': return n.a.map(toR).join(' * ');
    case '/': { const a = toR(n.a[0]), b = toR(n.a[1]); return (simple(a) || a[0] === '(' && a.endsWith(')') ? a : '(' + a + ')') + ' / ' + (simple(b) || b[0] === '(' && b.endsWith(')') ? b : '(' + b + ')'); }

      inp.addEventListener('change', () => {
        const v = parseNum(inp.value), b = bank(), k = inp.dataset.k, y = +inp.dataset.y;
        if (inp.value.trim() !== '' && v === null) { inp.classList.add('bad'); return; }
        inp.classList.remove('bad');
        b.v[k] = b.v[k] || b.years.map(() => null);
        b.v[k][y] = v;
        if (b.example) b.example = false;
        inp.value = v === null ? '' : fmtM(v);
        save(); refreshCalcs();
      });
    });
    const meta = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('change', () => { fn(el.value); save(); renderHeader(); }); };
    meta('m-name', v => { bank().name = v.trim() || 'Banque sans nom'; });
    meta('m-country', v => { bank().country = v.trim(); });
    meta('m-unit', v => { bank().unit = v.trim() || 'millions FCFA'; });
    bank().years.forEach((_, i) => { const el = $('#m-y' + i); el.addEventListener('change', () => {
      const b = bank(), n = parseInt(el.value, 10);
      if (!n || (b.years.includes(n) && b.years[i] !== n)) { toast(n ? 'L’exercice ' + n + ' existe déjà' : 'Année invalide'); el.value = b.years[i]; return; }
      b.years[i] = n; delete b.range; normBank(b); save(); renderAll(true);
    }); });
    const addY = yr => { const b = bank(); if (!yr || !addYear(b, yr)) { toast(yr ? 'L’exercice ' + yr + ' existe déjà' : 'Année invalide'); return; } delete b.range; b.example = false; save(); renderAll(true); toast('Exercice ' + yr + ' ajouté'); };
    $('#yPrev').onclick = () => addY(bank().years[0] - 1);
    $('#yNext').onclick = () => addY(bank().years[bank().years.length - 1] + 1);
    $('#yAnyBtn').onclick = () => addY(parseInt($('#yAny').value, 10));
    view.querySelectorAll('[data-rmy]').forEach(btn => btn.addEventListener('click', () => {
      const i = +btn.dataset.rmy, yr = bank().years[i];
      $('#confirmBox').innerHTML = '<div class="confirm">Retirer l’exercice ' + yr + ' et toutes ses données ?<button class="btn sm danger" id="yRmYes">Retirer</button><button class="btn sm" id="yRmNo">Annuler</button></div>';
      $('#yRmNo').onclick = () => { $('#confirmBox').innerHTML = ''; };
      $('#yRmYes').onclick = () => { removeYear(bank(), i); save(); renderAll(true); toast('Exercice ' + yr + ' retiré'); };
    }));
    view.querySelectorAll('[data-zero]').forEach(btn => btn.addEventListener('click', () => {
      const b = bank();
      FIELDS.filter(f => f.s === btn.dataset.zero).forEach(f => { b.v[f.k] = b.years.map((_, y) => raw(f.k, y) ?? 0); });
      save(); renderAll(true); toast('Cases vides complétées par 0');
    }));
    $('#bNew').onclick = () => { const id = 'b' + Date.now(); state.banks[id] = { id, name:'Nouvelle banque', country:'', unit:'millions FCFA', years:Y().slice(), v:{} }; state.cur = id; save(); renderAll(); };
    $('#bDup').onclick = () => { const id = 'b' + Date.now(); state.banks[id] = Object.assign(clone(bank()), { id, name:bank().name + ' (copie)', example:false }); state.cur = id; save(); renderAll(); };
    $('#bSample').onclick = () => { state.banks.bab = clone(SAMPLE); state.cur = 'bab'; save(); renderAll(); toast('Exemple BAB rechargé'); };
    $('#bDel').onclick = () => {
      $('#confirmBox').innerHTML = '<div class="confirm">Supprimer définitivement « ' + esc(bank().name) + ' » de cet appareil ?<button class="btn sm danger" id="bDelYes">Supprimer</button><button class="btn sm" id="bDelNo">Annuler</button></div>';
      $('#bDelNo').onclick = () => { $('#confirmBox').innerHTML = ''; };
      $('#bDelYes').onclick = () => { delete state.banks[state.cur]; if (!Object.keys(state.banks).length) state.banks.bab = clone(SAMPLE); state.cur = Object.keys(state.banks)[0]; save(); renderAll(); toast('Banque supprimée'); };
    };
  }
  if (state.tab === 'renta') {
    $('#baseFin').onclick = () => { state.base = 'fin'; save(); renderAll(true); };
    $('#baseMoy').onclick = () => { state.base = 'moy'; save(); renderAll(true); };
  }
  if (state.tab === 'faillite' && $('#sPnb')) {
    const upd = () => { state.shock = { pnb:+$('#sPnb').value, cdr:+$('#sCdr').value }; const sim = $('#sim'); sim.outerHTML = simulator(); bindSim(); };
    const bindSim = () => { $('#sPnb').oninput = upd; $('#sCdr').oninput = upd; };
    bindSim();
  }
  if (state.tab === 'params') {
    view.querySelectorAll('input[data-p]').forEach(inp => inp.addEventListener('change', () => { const v = parseNum(inp.value); if (v === null) return; state.params[inp.dataset.p] = v; save(); toast('Paramètre appliqué'); }));
    $('#pReset').onclick = () => { state.params = Object.assign({}, DEFAULT_PARAMS); save(); renderAll(true); toast('Valeurs par défaut rétablies'); };
  }
  if (state.tab === 'r') $('#rCopy').onclick = () => copyText(rScript());
  if (state.tab === 'import') {
    $('#impParse').onclick = () => previewImport(parseImport($('#impText').value));
    $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#impText').value = r.result; previewImport(parseImport(r.result)); }; r.readAsText(f); };
    $('#expCsv').onclick = () => copyText(toCsv(false), $('#expOut'));
    $('#expTpl').onclick = () => copyText(toCsv(true), $('#expOut'));
    $('#expJson').onclick = () => copyText(JSON.stringify({ banks:state.banks, cur:state.cur, params:state.params }, null, 1), $('#expOut'));
  }
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; state.tab = b.dataset.tab; state.yi = 99; save(); renderAll(); window.scrollTo(0, 0); });
$('#bankSel').addEventListener('change', e => { state.cur = e.target.value; state.yi = 99; save(); renderAll(); });
$('#yearSel').addEventListener('change', e => { state.yi = +e.target.value; renderAll(true); });
function setRange() {
  const b = bank(), a = +$('#fromSel').value, z = +$('#toSel').value;
  b.range = [Math.min(a, z), Math.max(a, z)];
  if (b.range[0] === b.years[0] && b.range[1] === b.years[b.years.length - 1]) delete b.range;
  state.yi = Y().length - 1; save(); renderAll(true);
}
$('#fromSel').addEventListener('change', setRange);
$('#toSel').addEventListener('change', setRange);

/* Info-bulles (survol, focus, toucher) */
const tip = $('#tip');
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive:true });

renderAll();
</script>
